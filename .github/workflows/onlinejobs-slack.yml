name: OnlineJobs.ph Slack Job Feed

# Every hour: scrape the latest onlinejobs.ph postings, classify each one,
# and post new jobs to Slack. See scripts/onlinejobs-slack/README.md for
# the required secrets and channel configuration.

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 min; GitHub schedule is best-effort and may skip/delay slots
  workflow_dispatch: # manual runs from the Actions tab, with optional overrides
    inputs:
      max_age_hours:
        description: "Freshness window in hours (blank = default 2). Use e.g. 6 for a backfill."
        required: false
        default: ""
      ignore_seen:
        description: "Set true to post even jobs already recorded (one-off backfill; ignores dedup)."
        required: false
        default: "false"
      max_posts:
        description: "Max jobs to post this run (blank = no cap). Caps a backfill."
        required: false
        default: ""

concurrency:
  group: onlinejobs-slack
  cancel-in-progress: false

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest
    # Secrets are mapped to env at the job level so a step-level `if` can gate
    # on them — the `secrets` context isn't allowed in `if` expressions.
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Empty on scheduled runs (falls back to config defaults); set via manual dispatch.
      MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours }}
      IGNORE_SEEN: ${{ github.event.inputs.ignore_seen == 'true' && '1' || '' }}
      MAX_POSTS: ${{ github.event.inputs.max_posts }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dedup state survives between runs via the cache. Keys are immutable,
      # so each run saves under its own run_id and restores the newest match.
      - name: Restore seen-jobs state
        uses: actions/cache@v4
        with:
          path: .state
          key: onlinejobs-seen-${{ github.run_id }}
          restore-keys: |
            onlinejobs-seen-

      - name: Install Claude SDK (only when AI classification is enabled)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        working-directory: scripts/onlinejobs-slack
        run: npm install --no-fund --no-audit

      - name: Scrape, classify, and post to Slack
        run: node scripts/onlinejobs-slack/scrape-and-post.mjs
