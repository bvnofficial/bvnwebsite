<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Client Proposal Generator</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--navy:#0A0F1E;--line:rgba(255,255,255,.08);--orange:#E86010;--orange-l:#ff7a2a;--txt:#e8eaf0;--mut:rgba(255,255,255,.5);--accent:#E86010;}
  html,body{background:var(--navy);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  .app{display:flex;min-height:100vh;}
  .editor{width:44%;max-width:560px;border-right:1px solid var(--line);height:100vh;overflow-y:auto;padding:22px 22px 80px;}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
  .brand .dot{width:26px;height:26px;border-radius:7px;background:rgba(232,96,16,.15);border:1px solid rgba(232,96,16,.3);display:flex;align-items:center;justify-content:center;font-size:14px;}
  .brand b{font-size:14px;}
  h1{font-size:20px;font-weight:800;margin:14px 0 2px;}
  .sub{color:var(--mut);font-size:12.5px;margin-bottom:16px;}
  .grp{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:rgba(255,255,255,.02);}
  .grp>summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;}
  .grp>summary::-webkit-details-marker{display:none;}
  .grp>summary .chev{color:var(--mut);transition:.2s;} .grp[open]>summary .chev{transform:rotate(90deg);}
  .grp .body{padding:4px 14px 14px;}
  label{display:block;font-size:11.5px;color:var(--mut);margin:10px 0 4px;font-weight:600;}
  input,textarea,select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--txt);font-size:13px;font-family:inherit;}
  input:focus,textarea:focus{outline:none;border-color:rgba(232,96,16,.5);background:rgba(255,255,255,.06);}
  textarea{resize:vertical;min-height:60px;line-height:1.5;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .item{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:10px;position:relative;}
  .item .del{position:absolute;top:8px;right:8px;background:rgba(255,60,60,.12);border:1px solid rgba(255,60,60,.25);color:#ff8a8a;border-radius:6px;width:24px;height:24px;cursor:pointer;}
  .addbtn{margin-top:10px;width:100%;background:rgba(232,96,16,.1);border:1px solid rgba(232,96,16,.3);color:var(--orange-l);border-radius:8px;padding:9px;font-weight:700;font-size:12.5px;cursor:pointer;}
  .addbtn:hover{background:rgba(232,96,16,.18);}
  .accents{display:flex;gap:8px;flex-wrap:wrap;} .sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;} .sw.on{border-color:#fff;}
  .preview{flex:1;height:100vh;overflow-y:auto;background:#525866;padding:28px 20px;display:flex;flex-direction:column;align-items:center;}
  .toolbar{position:sticky;top:-28px;z-index:5;margin:-28px -20px 20px;padding:14px 20px;background:rgba(10,15,30,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:calc(100% + 40px);}
  .btn{border:none;border-radius:8px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:inherit;}
  .btn.primary{background:var(--orange);color:#fff;} .btn.primary:hover{background:var(--orange-l);}
  .btn.ghost{background:rgba(255,255,255,.08);color:#fff;} .btn.ghost:hover{background:rgba(255,255,255,.15);}
  .saved{color:rgba(255,255,255,.6);font-size:11.5px;margin-left:auto;}
  /* doc */
  .paper{width:100%;max-width:794px;background:#fff;color:#1a1a22;border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.4);padding:52px 56px;min-height:1000px;}
  .d-cover{border-bottom:3px solid var(--accent);padding-bottom:22px;margin-bottom:26px;}
  .d-kick{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:800;}
  .d-title{font-size:30px;font-weight:800;color:#12141c;margin-top:8px;line-height:1.15;}
  .d-meta{display:flex;justify-content:space-between;gap:20px;margin-top:20px;flex-wrap:wrap;}
  .d-meta .blk{font-size:12.5px;color:#555;} .d-meta .blk b{display:block;color:#1c1c26;font-size:13px;margin-bottom:2px;}
  .d-sec{margin-top:26px;} .d-sec h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:10px;}
  .d-sec p{font-size:13px;line-height:1.7;color:#3a3a44;}
  .d-list{list-style:none;} .d-list li{font-size:13px;line-height:1.6;color:#3a3a44;padding-left:20px;position:relative;margin-bottom:9px;}
  .d-list li::before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .d-list li b{color:#1c1c26;}
  .d-phase{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee;font-size:13px;}
  .d-phase b{color:#1c1c26;} .d-phase span{color:#888;white-space:nowrap;}
  .d-pkgs{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .d-pkg{border:1px solid #e6e7ec;border-radius:12px;padding:18px;} .d-pkg.hl{border-color:var(--accent);border-width:2px;}
  .d-pkg .pn{font-size:14px;font-weight:800;color:#1c1c26;} .d-pkg .pp{font-size:22px;font-weight:800;color:var(--accent);margin:6px 0 10px;}
  .d-pkg .pi{font-size:12px;color:#5a5a64;line-height:1.6;}
  .d-total{margin-top:14px;text-align:right;font-size:16px;font-weight:800;color:#1c1c26;}
  .d-total span{color:var(--accent);}
  .d-sign{margin-top:34px;display:flex;justify-content:space-between;gap:30px;}
  .d-sign .s{flex:1;} .d-sign .ln{border-top:1px solid #999;margin-top:34px;padding-top:5px;font-size:11.5px;color:#888;}
  .foot{text-align:center;color:rgba(255,255,255,.4);font-size:11px;margin-top:18px;} .foot a{color:rgba(255,255,255,.6);}
  @media(max-width:900px){.app{flex-direction:column;}.editor{width:100%;max-width:none;height:auto;border-right:none;border-bottom:1px solid var(--line);}.preview{height:auto;}.toolbar{position:static;margin:0 0 16px;width:100%;border-radius:10px;border:1px solid var(--line);}.d-pkgs{grid-template-columns:1fr;}}
  @media print{@page{margin:0;}.editor,.toolbar,.foot{display:none !important;}.preview{padding:0;height:auto;overflow:visible;background:#fff;display:block;}.paper{box-shadow:none;border-radius:0;max-width:none;padding:38px 44px;min-height:auto;}}
</style>
</head>
<body>
<div class="app">
  <div class="editor">
    <div class="brand"><span class="dot">📑</span><b>BVN · Proposal Generator</b></div>
    <h1>Create a client proposal</h1>
    <div class="sub">Fill in the details and send a proposal that wins the deal. Export as PDF or HTML. Saves in your browser.</div>

    <details class="grp" open><summary>Cover <span class="chev">›</span></summary>
      <div class="body">
        <label>Proposal title</label><input id="f_title" placeholder="Social Media Management Proposal"/>
        <div class="row2"><div><label>From (you / business)</label><input id="f_from" placeholder="Maria Santos VA"/></div>
        <div><label>Your email</label><input id="f_fromemail" placeholder="maria@email.com"/></div></div>
        <div class="row2"><div><label>Prepared for (client)</label><input id="f_client" placeholder="Acme Coaching"/></div>
        <div><label>Date</label><input id="f_date" placeholder="July 2026"/></div></div>
        <label>Accent color</label><div class="accents" id="accents"></div>
      </div>
    </details>

    <details class="grp" open><summary>Overview <span class="chev">›</span></summary>
      <div class="body"><textarea id="f_overview" placeholder="A short paragraph on the client's situation and what you'll help them achieve."></textarea></div>
    </details>

    <details class="grp"><summary>Objectives <span class="chev">›</span></summary>
      <div class="body"><label>Goals (one per line)</label><textarea id="f_objectives" placeholder="Grow booked calls by 30%&#10;Keep the CRM clean and organized"></textarea></div>
    </details>

    <details class="grp" open><summary>Scope / Deliverables <span class="chev">›</span></summary>
      <div class="body"><div id="del_list"></div><button class="addbtn" onclick="addDel()">+ Add deliverable</button></div>
    </details>

    <details class="grp"><summary>Timeline <span class="chev">›</span></summary>
      <div class="body"><div id="ph_list"></div><button class="addbtn" onclick="addPh()">+ Add phase</button></div>
    </details>

    <details class="grp" open><summary>Investment <span class="chev">›</span></summary>
      <div class="body"><div id="pkg_list"></div><button class="addbtn" onclick="addPkg()">+ Add package</button></div>
    </details>

    <details class="grp"><summary>Next Steps <span class="chev">›</span></summary>
      <div class="body"><textarea id="f_next" placeholder="How the client moves forward — e.g. approve this proposal, book a kickoff call, and we start on [date]."></textarea></div>
    </details>
  </div>

  <div class="preview">
    <div class="toolbar">
      <button class="btn primary" onclick="window.print()">⬇ Download PDF</button>
      <button class="btn ghost" onclick="downloadHTML()">⬇ Download HTML</button>
      <button class="btn ghost" onclick="resetAll()">↺ Reset</button>
      <span class="saved" id="saved">Saved ✓</span>
    </div>
    <div class="paper" id="paper"></div>
    <div class="foot">Built free with <a href="https://www.bvnofficial.com/apps" target="_blank">BVN Apps</a></div>
  </div>
</div>

<script>
const ACCENTS=["#E86010","#2563eb","#0d9488","#7c3aed","#db2777","#0f172a"];
const $=id=>document.getElementById(id);
let state=load()||{
  title:"Social Media Management Proposal", from:"Maria Santos VA", fromemail:"maria@email.com",
  client:"Acme Coaching", date:"July 2026", accent:"#E86010",
  overview:"Acme Coaching wants to grow its audience and book more discovery calls without the founder spending hours on content. This proposal outlines how I'll manage your social media end to end.",
  objectives:"Grow booked discovery calls by 30%\nPost consistently across Instagram and LinkedIn\nBuild a repeatable content system",
  del:[{t:"Content creation",d:"12 branded posts + 8 stories per month, written and designed."},
       {t:"Scheduling & publishing",d:"All content scheduled and published on a consistent calendar."},
       {t:"Monthly report",d:"A simple report on growth, engagement, and what's working."}],
  ph:[{n:"Onboarding & setup",d:"Week 1"},{n:"First content batch live",d:"Week 2"},{n:"Ongoing management",d:"Monthly"}],
  pkg:[{n:"Starter",p:"$600/mo",i:"12 posts + 8 stories, scheduling, monthly report.",hl:false},
       {n:"Growth",p:"$1,000/mo",i:"20 posts + 15 stories, engagement, strategy call, full report.",hl:true}],
  next:"To get started, approve this proposal and book a kickoff call. Once confirmed, onboarding begins within 3 business days."
};

function bind(id,key){const el=$(id);el.value=state[key]||"";el.addEventListener("input",()=>{state[key]=el.value;render();save();});}
["title","from","fromemail","client","date","overview","objectives","next"].forEach(k=>bind("f_"+k,k));
const accW=$("accents");
ACCENTS.forEach(c=>{const s=document.createElement("div");s.className="sw"+(c===state.accent?" on":"");s.style.background=c;
  s.onclick=()=>{state.accent=c;[...accW.children].forEach(x=>x.classList.remove("on"));s.classList.add("on");render();save();};accW.appendChild(s);});

function addDel(){state.del.push({t:"",d:""});renderDel();save();}
function addPh(){state.ph.push({n:"",d:""});renderPh();save();}
function addPkg(){state.pkg.push({n:"",p:"",i:"",hl:false});renderPkg();save();}
function del(arr,i,fn){state[arr].splice(i,1);fn();render();save();}
function up(arr,i,k,v){state[arr][i][k]=v;render();save();}
function togglehl(i){state.pkg.forEach((p,j)=>p.hl=(j===i));renderPkg();render();save();}

function renderDel(){$("del_list").innerHTML=state.del.map((e,i)=>`
  <div class="item"><button class="del" onclick="del('del',${i},renderDel)">✕</button>
  <label>Deliverable</label><input value="${esc(e.t)}" oninput="up('del',${i},'t',this.value)" placeholder="Content creation"/>
  <label>Details</label><textarea oninput="up('del',${i},'d',this.value)" placeholder="What's included.">${esc(e.d)}</textarea></div>`).join("");}
function renderPh(){$("ph_list").innerHTML=state.ph.map((e,i)=>`
  <div class="item"><button class="del" onclick="del('ph',${i},renderPh)">✕</button>
  <label>Phase</label><input value="${esc(e.n)}" oninput="up('ph',${i},'n',this.value)" placeholder="Onboarding"/>
  <label>When</label><input value="${esc(e.d)}" oninput="up('ph',${i},'d',this.value)" placeholder="Week 1"/></div>`).join("");}
function renderPkg(){$("pkg_list").innerHTML=state.pkg.map((e,i)=>`
  <div class="item"><button class="del" onclick="del('pkg',${i},renderPkg)">✕</button>
  <div class="row2"><div><label>Package</label><input value="${esc(e.n)}" oninput="up('pkg',${i},'n',this.value)" placeholder="Growth"/></div>
  <div><label>Price</label><input value="${esc(e.p)}" oninput="up('pkg',${i},'p',this.value)" placeholder="$1,000/mo"/></div></div>
  <label>Includes</label><textarea oninput="up('pkg',${i},'i',this.value)" placeholder="What's in this package.">${esc(e.i)}</textarea>
  <label style="display:inline-flex;align-items:center;gap:6px;margin-top:8px;cursor:pointer;"><input type="checkbox" style="width:auto;" ${e.hl?"checked":""} onchange="togglehl(${i})"/> Highlight this package</label></div>`).join("");}

function render(){
  document.documentElement.style.setProperty("--accent",state.accent);
  const obj=(state.objectives||"").split("\n").map(x=>x.trim()).filter(Boolean).map(o=>`<li>${esc(o)}</li>`).join("");
  const del=state.del.filter(e=>e.t).map(e=>`<li><b>${esc(e.t)}</b>${e.d?` — ${esc(e.d)}`:""}</li>`).join("");
  const ph=state.ph.filter(e=>e.n).map(e=>`<div class="d-phase"><b>${esc(e.n)}</b><span>${esc(e.d)}</span></div>`).join("");
  const pkg=state.pkg.filter(e=>e.n).map(e=>`<div class="d-pkg ${e.hl?"hl":""}"><div class="pn">${esc(e.n)}</div><div class="pp">${esc(e.p)}</div><div class="pi">${esc(e.i).replace(/\n/g,"<br>")}</div></div>`).join("");
  $("paper").innerHTML=`
    <div class="d-cover"><div class="d-kick">Proposal</div><div class="d-title">${esc(state.title)||"Project Proposal"}</div>
      <div class="d-meta">
        <div class="blk"><b>Prepared by</b>${esc(state.from)}<br>${esc(state.fromemail)}</div>
        <div class="blk"><b>Prepared for</b>${esc(state.client)}</div>
        <div class="blk"><b>Date</b>${esc(state.date)}</div>
      </div></div>
    ${state.overview?`<div class="d-sec"><h2>Overview</h2><p>${esc(state.overview)}</p></div>`:""}
    ${obj?`<div class="d-sec"><h2>Objectives</h2><ul class="d-list">${obj}</ul></div>`:""}
    ${del?`<div class="d-sec"><h2>Scope &amp; Deliverables</h2><ul class="d-list">${del}</ul></div>`:""}
    ${ph?`<div class="d-sec"><h2>Timeline</h2>${ph}</div>`:""}
    ${pkg?`<div class="d-sec"><h2>Investment</h2><div class="d-pkgs">${pkg}</div></div>`:""}
    ${state.next?`<div class="d-sec"><h2>Next Steps</h2><p>${esc(state.next)}</p></div>`:""}
    <div class="d-sign"><div class="s"><div class="ln">Client signature &amp; date</div></div><div class="s"><div class="ln">${esc(state.from)}</div></div></div>
  `;
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
let t;function save(){clearTimeout(t);$("saved").textContent="Saving…";t=setTimeout(()=>{localStorage.setItem("bvn_proposal",JSON.stringify(state));$("saved").textContent="Saved ✓";},400);}
function load(){try{return JSON.parse(localStorage.getItem("bvn_proposal"));}catch(e){return null;}}
function resetAll(){if(confirm("Clear everything and start fresh?")){localStorage.removeItem("bvn_proposal");location.reload();}}
function downloadHTML(){
  const css=document.querySelector("style").innerHTML.split("/* doc */")[1].split("@media")[0];
  const doc=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(state.title)}</title>
  <style>:root{--accent:${state.accent};}body{margin:0;background:#eef0f4;font-family:Inter,system-ui,Arial,sans-serif;padding:24px;}.paper{max-width:794px;margin:0 auto;background:#fff;color:#1a1a22;padding:52px 56px;box-shadow:0 6px 24px rgba(0,0,0,.12);}${css}</style></head>
  <body><div class="paper">${$("paper").innerHTML}</div></body></html>`;
  const blob=new Blob([doc],{type:"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=(state.title||"proposal").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".html";a.click();
}
renderDel();renderPh();renderPkg();render();
</script>
</body>
</html>
