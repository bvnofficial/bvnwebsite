<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EQ 80th Birthday — AVP Script</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #fff;
    font-family: 'Georgia', serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  #topbar {
    background: linear-gradient(180deg,#111118,transparent);
    padding: 14px 28px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
    z-index: 10;
  }
  #title-label {
    font-size: 13px;
    color: #d4af37;
    letter-spacing: 3px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* progress bar */
  #progress-wrap { flex: 1; position: relative; }
  #progress-bg {
    height: 4px; background: #2a2a3a; border-radius: 2px; cursor: pointer;
  }
  #progress-fill {
    height: 100%; background: #d4af37; border-radius: 2px;
    width: 0%; transition: width 0.3s;
  }
  #time-label {
    font-size: 12px; color: #888; margin-top: 4px; text-align: right;
  }

  /* controls */
  #controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .btn {
    background: #1e1e2e; border: 1px solid #333;
    color: #ccc; padding: 7px 14px; border-radius: 6px;
    cursor: pointer; font-size: 13px; transition: all .15s;
  }
  .btn:hover { background: #2a2a3e; color: #fff; border-color: #d4af37; }
  .btn.active, #playbtn.playing { background: #d4af37; color: #000; border-color: #d4af37; }
  #speed-select {
    background: #1e1e2e; border: 1px solid #333; color: #ccc;
    padding: 7px 8px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }

  /* ── SCRIPT AREA ── */
  #script-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* gradient masks top/bottom */
  #script-wrap::before, #script-wrap::after {
    content: '';
    position: absolute; left: 0; right: 0; height: 120px; z-index: 2; pointer-events: none;
  }
  #script-wrap::before { top: 0; background: linear-gradient(180deg, #0a0a0f 0%, transparent 100%); }
  #script-wrap::after  { bottom: 0; background: linear-gradient(0deg, #0a0a0f 0%, transparent 100%); }

  #script-inner {
    width: 100%; max-width: 860px;
    padding: 0 40px;
    overflow: hidden;
    height: 100%;
    position: relative;
  }

  #script-scroll {
    transition: transform 0.6s cubic-bezier(.4,0,.2,1);
    padding: 45vh 0;
  }

  /* lines */
  .line {
    text-align: center;
    padding: 10px 0;
    transition: all 0.4s ease;
    cursor: pointer;
    user-select: none;
  }
  .line .text {
    font-size: 28px;
    line-height: 1.55;
    color: #444;
    transition: color 0.4s, text-shadow 0.4s, font-size 0.4s;
    white-space: pre-line;
  }
  .line.past .text { color: #2a2a3a; }
  .line.active .text {
    color: #ffffff;
    font-size: 34px;
    text-shadow: 0 0 40px rgba(212,175,55,0.35);
  }
  .line.near .text { color: #666; font-size: 26px; }

  /* chapter lines */
  .line.chapter-line { padding: 28px 0 14px; }
  .line.chapter-line .text {
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #2a2a2a;
    font-family: 'Arial', sans-serif;
    font-weight: bold;
  }
  .line.chapter-line.active .text {
    color: #d4af37;
    font-size: 14px;
    text-shadow: 0 0 20px rgba(212,175,55,0.5);
  }
  .line.chapter-line.past .text { color: #1a1a1a; }

  /* name lines (Carlo, Angel, etc.) */
  .line.name-line.active .text {
    color: #d4af37;
    font-size: 42px;
    font-style: italic;
    text-shadow: 0 0 50px rgba(212,175,55,0.5);
  }

  /* gold divider between chapters */
  .chapter-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #d4af3740, transparent);
    margin: 8px 80px;
  }

  /* blank lines (photos with no subtitle) */
  .line.blank-line { padding: 4px 0; }
  .line.blank-line .text { font-size: 14px; color: #1a1a1a; }
  .line.blank-line.active .text { color: #333; font-size: 14px; }

  /* ── BOTTOM HINT ── */
  #hint {
    text-align: center;
    font-size: 11px;
    color: #2a2a3a;
    padding: 8px;
    flex-shrink: 0;
    letter-spacing: 2px;
  }

  /* spacebar visual flash */
  body.flash { background: #0f0f18; }

  /* Opening overlay */
  #opening {
    position: fixed; inset: 0; background: #08080f;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; transition: opacity 1s;
  }
  #opening h1 {
    color: #d4af37; font-size: 38px; letter-spacing: 4px;
    text-align: center; text-transform: uppercase; margin-bottom: 10px;
  }
  #opening h2 {
    color: #888; font-size: 18px; letter-spacing: 2px; text-align: center; margin-bottom: 60px;
  }
  #start-btn {
    background: #d4af37; color: #000; border: none;
    padding: 16px 48px; font-size: 18px; border-radius: 8px;
    cursor: pointer; letter-spacing: 2px; font-family: 'Arial', sans-serif;
    font-weight: bold; transition: transform .15s;
  }
  #start-btn:hover { transform: scale(1.05); }
</style>

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let currentIdx = 0;
let playing    = false;
let speed      = 1.0;
let startTime  = null;
let elapsed    = 0;
let rafId      = null;
let totalDur   = SCRIPT[SCRIPT.length - 1].t + 5;

// ─────────────────────────────────────────────
// BUILD DOM
// ─────────────────────────────────────────────
function buildScript() {
  const scroll = document.getElementById('script-scroll');
  SCRIPT.forEach((item, i) => {
    if (item.type === 'chapter' && i > 0) {
      const div = document.createElement('div');
      div.className = 'chapter-divider';
      scroll.appendChild(div);
    }
    const wrap = document.createElement('div');
    wrap.className = 'line ' + item.type + '-line';
    wrap.dataset.idx = i;
    wrap.innerHTML = `<span class="text">${item.text || '·'}</span>`;
    wrap.addEventListener('click', () => { jumpTo(i); });
    scroll.appendChild(wrap);
  });
}

// ─────────────────────────────────────────────
// HIGHLIGHT
// ─────────────────────────────────────────────
function updateHighlight(idx) {
  const lines = document.querySelectorAll('.line');
  lines.forEach(el => {
    const i = parseInt(el.dataset.idx);
    el.classList.remove('active', 'past', 'near');
    if (i === idx)      el.classList.add('active');
    else if (i < idx)  el.classList.add('past');
    else if (i <= idx+2) el.classList.add('near');
  });
  // Scroll active line to center
  const active = document.querySelector('.line.active');
  if (active) {
    const wrap   = document.getElementById('script-inner');
    const scroll = document.getElementById('script-scroll');
    const wrapH  = wrap.clientHeight;
    const offset = active.offsetTop - wrapH/2 + active.clientHeight/2;
    scroll.style.transform = `translateY(-${offset}px)`;
  }
  // Progress
  const t = SCRIPT[idx].t;
  document.getElementById('progress-fill').style.width = (t / totalDur * 100) + '%';
  document.getElementById('time-label').textContent = fmt(t) + ' / ' + fmt(totalDur);
}

function fmt(s) {
  const m = Math.floor(s/60), ss = Math.floor(s%60);
  return m + ':' + String(ss).padStart(2,'0');
}

// ─────────────────────────────────────────────
// PLAYBACK
// ─────────────────────────────────────────────
function tick(now) {
  if (!playing) return;
  const delta = (now - startTime) / 1000 * speed;
  const t     = elapsed + delta;

  // Find current index by time
  let idx = 0;
  for (let i = 0; i < SCRIPT.length; i++) {
    if (SCRIPT[i].t <= t) idx = i;
    else break;
  }
  if (idx !== currentIdx) {
    currentIdx = idx;
    updateHighlight(currentIdx);
  }

  if (t >= totalDur) {
    pause();
    return;
  }
  rafId = requestAnimationFrame(tick);
}

function play() {
  if (playing) return;
  playing   = true;
  startTime = performance.now();
  document.getElementById('playbtn').textContent = '⏸ Pause';
  document.getElementById('playbtn').classList.add('playing');
  rafId = requestAnimationFrame(tick);
}

function pause() {
  if (!playing) return;
  playing = false;
  elapsed += (performance.now() - startTime) / 1000 * speed;
  cancelAnimationFrame(rafId);
  document.getElementById('playbtn').textContent = '▶ Play';
  document.getElementById('playbtn').classList.remove('playing');
}

function togglePlay() { playing ? pause() : play(); }

function jumpTo(idx) {
  pause();
  currentIdx = Math.max(0, Math.min(idx, SCRIPT.length-1));
  elapsed = SCRIPT[currentIdx].t;
  updateHighlight(currentIdx);
}

function jump(dir) { jumpTo(currentIdx + dir); }

function setSpeed(v) {
  if (playing) {
    elapsed += (performance.now() - startTime) / 1000 * speed;
    startTime = performance.now();
  }
  speed = parseFloat(v);
}

function seekProgress(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct  = (e.clientX - rect.left) / rect.width;
  const t    = pct * totalDur;
  let idx = 0;
  for (let i = 0; i < SCRIPT.length; i++) {
    if (SCRIPT[i].t <= t) idx = i;
  }
  jumpTo(idx);
}

function resetShow() {
  pause();
  elapsed    = 0;
  currentIdx = 0;
  updateHighlight(0);
}

function startShow() {
  const ov = document.getElementById('opening');
  ov.style.opacity = '0';
  setTimeout(() => ov.style.display = 'none', 1000);
  updateHighlight(0);
  play();
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.code === 'Space')       { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight')  { jump(1); }
  if (e.code === 'ArrowLeft')   { jump(-1); }
  if (e.code === 'ArrowUp')     { jump(-3); }
  if (e.code === 'ArrowDown')   { jump(3); }
  if (e.code === 'Home')        { jumpTo(0); }
  if (e.code === 'End')         { jumpTo(SCRIPT.length-1); }
});

// Init
buildScript();
updateHighlight(0);
</script>
