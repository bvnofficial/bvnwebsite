<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Invoice Generator – Create & Download PDF Invoices Free</title>
<meta name="description" content="Create professional invoices instantly. Add your logo, line items, taxes and download as PDF. Free, no signup required."/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='2' width='24' height='28' rx='2' fill='%23fff' stroke='%232563eb' stroke-width='2'/><rect x='8' y='10' width='16' height='2' rx='1' fill='%232563eb'/><rect x='8' y='15' width='12' height='2' rx='1' fill='%23bbb'/><rect x='8' y='20' width='14' height='2' rx='1' fill='%23bbb'/></svg>"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f0ede8}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Top bar */
#topbar{
  display:flex;align-items:center;gap:10px;padding:0 16px;
  background:#1e3a5f;color:#fff;height:48px;flex-shrink:0;
}
#topbar h1{font-size:16px;font-weight:700;letter-spacing:-.02em}
#topbar p{font-size:11px;color:#93b8dc;margin-left:auto}
.top-btn{
  padding:7px 16px;font-size:12px;font-weight:600;border:none;border-radius:5px;
  cursor:pointer;transition:all .12s;
}
#btn-pdf{background:#2563eb;color:#fff}
#btn-pdf:hover{background:#1d4ed8}
#btn-new{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
#btn-new:hover{background:rgba(255,255,255,.2)}

/* Layout */
#main{display:flex;flex:1;overflow:hidden}

/* Form panel */
#form-panel{
  width:340px;min-width:340px;background:#fff;
  border-right:1px solid #e0dbd4;
  overflow-y:auto;padding:0;
}
.form-section{padding:14px 16px;border-bottom:1px solid #f0ece8}
.form-section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#6b7280;margin-bottom:10px}
.field{margin-bottom:8px}
.field label{display:block;font-size:11px;font-weight:500;color:#6b7280;margin-bottom:3px}
.field input,.field select,.field textarea{
  width:100%;padding:7px 9px;font-size:13px;
  border:1px solid #ddd8d2;border-radius:5px;background:#fafaf8;color:#1f1a17;
  transition:border .12s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:#2563eb;
}
.field textarea{resize:vertical;min-height:56px}
.row2{display:flex;gap:8px}
.row2 .field{flex:1}

/* Logo upload */
#logo-area{
  width:100%;height:70px;border:2px dashed #d0cac4;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#9a908a;font-size:12px;gap:8px;
  transition:all .12s;background:#fafaf8;
}
#logo-area:hover{border-color:#2563eb;color:#2563eb;background:#eff6ff}
#logo-preview{max-height:60px;max-width:200px;object-fit:contain;display:none}
#logo-input{display:none}

/* Line items */
#items-table{width:100%;border-collapse:collapse;margin-top:6px}
#items-table th{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;padding:4px 6px;border-bottom:1px solid #e5e7eb;text-align:left}
#items-table td{padding:3px 4px;vertical-align:middle}
#items-table input{
  width:100%;padding:5px 6px;font-size:12px;
  border:1px solid transparent;border-radius:3px;background:transparent;color:#1f1a17;
}
#items-table input:focus{border-color:#2563eb;background:#fff;outline:none}
.item-del{
  background:none;border:none;color:#e5e7eb;cursor:pointer;font-size:15px;
  padding:2px 4px;border-radius:3px;
}
.item-del:hover{color:#ef4444;background:#fef2f2}
#add-item-btn{
  width:100%;padding:7px;font-size:12px;color:#2563eb;
  background:#eff6ff;border:1px dashed #93c5fd;border-radius:5px;
  cursor:pointer;font-weight:500;margin-top:6px;
}
#add-item-btn:hover{background:#dbeafe}

/* Colors */
.color-row{display:flex;gap:5px;margin-top:5px}
.color-swatch{
  width:22px;height:22px;border-radius:4px;border:2px solid transparent;
  cursor:pointer;transition:transform .1s;
}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.active{border-color:#1f1a17}

/* ── Invoice Preview ── */
#preview-wrap{
  flex:1;overflow-y:auto;padding:24px;
  display:flex;justify-content:center;align-items:flex-start;
}
#invoice{
  width:760px;min-height:1020px;background:#fff;
  box-shadow:0 4px 24px rgba(0,0,0,.12);
  padding:50px 56px;position:relative;font-family:'Georgia',serif;
  border-radius:2px;
}
/* Accent top bar */
#invoice::before{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:var(--accent,#1e3a5f);border-radius:2px 2px 0 0;
}

/* Invoice header */
.inv-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:40px}
.inv-logo-area{max-height:80px;max-width:200px;overflow:hidden}
.inv-logo-area img{max-height:80px;max-width:200px;object-fit:contain}
.inv-logo-area .inv-company-name{font-size:22px;font-weight:700;color:#1f1a17;letter-spacing:-.02em;font-family:system-ui}
.inv-title{text-align:right}
.inv-title h2{font-size:36px;font-weight:800;color:var(--accent,#1e3a5f);letter-spacing:-.02em;font-family:system-ui}
.inv-meta{margin-top:6px;font-family:system-ui}
.inv-meta table td{font-size:12px;padding:2px 0;color:#6b7280}
.inv-meta table td:first-child{font-weight:600;color:#374151;padding-right:12px}
.inv-meta table td.val{color:#1f1a17;font-weight:600}

/* Addresses */
.inv-addresses{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:36px}
.inv-addr h4{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#9ca3af;margin-bottom:6px;font-family:system-ui}
.inv-addr .name{font-size:15px;font-weight:700;color:#1f1a17;font-family:system-ui}
.inv-addr p{font-size:13px;color:#6b7280;line-height:1.6;font-family:system-ui}

/* Line items */
.inv-table{width:100%;border-collapse:collapse;margin-bottom:24px}
.inv-table th{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:#fff;background:var(--accent,#1e3a5f);padding:10px 12px;font-family:system-ui;
}
.inv-table th:last-child,.inv-table td:last-child{text-align:right}
.inv-table td{padding:11px 12px;font-size:13px;color:#374151;border-bottom:1px solid #f3f4f6;font-family:system-ui}
.inv-table tbody tr:nth-child(even) td{background:#fafafa}
.inv-table td.desc{color:#1f1a17}
.inv-table td.amount{font-weight:600;color:#1f1a17}

/* Totals */
.inv-totals{display:flex;justify-content:flex-end;margin-bottom:32px}
.inv-totals table{min-width:260px}
.inv-totals td{padding:5px 0;font-size:13px;color:#6b7280;font-family:system-ui}
.inv-totals td:last-child{text-align:right;font-weight:500;color:#1f1a17;padding-left:24px}
.inv-totals .total-row td{
  border-top:2px solid var(--accent,#1e3a5f);padding-top:10px;margin-top:4px;
  font-size:16px;font-weight:800;color:var(--accent,#1e3a5f);
}

/* Notes */
.inv-notes{margin-top:10px;padding-top:20px;border-top:1px solid #f3f4f6}
.inv-notes h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#9ca3af;margin-bottom:6px;font-family:system-ui}
.inv-notes p{font-size:12px;color:#6b7280;line-height:1.6;font-family:system-ui;white-space:pre-line}

/* Footer */
.inv-footer{
  position:absolute;bottom:36px;left:56px;right:56px;
  display:flex;justify-content:space-between;align-items:center;
  border-top:1px solid #e5e7eb;padding-top:14px;
}
.inv-footer p{font-size:11px;color:#9ca3af;font-family:system-ui}
.inv-status{
  display:inline-block;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;font-family:system-ui;
}
.status-unpaid{background:#fef3c7;color:#92400e}
.status-paid{background:#d1fae5;color:#065f46}

/* ── Print styles ── */
@media print{
  body{overflow:visible;height:auto}
  #topbar,#form-panel{display:none!important}
  #main{overflow:visible;display:block}
  #preview-wrap{padding:0;overflow:visible;display:block}
  #invoice{box-shadow:none;width:100%;min-height:auto;page-break-inside:avoid}
}
</style>
</head>
<body>

<div id="topbar">
  <h1>📄 Invoice Generator</h1>
  <button class="top-btn" id="btn-new" onclick="newInvoice()">+ New Invoice</button>
  <button class="top-btn" id="btn-pdf" onclick="downloadPDF()">⬇ Download PDF</button>
  <p>Free · No signup · Works offline</p>
</div>

<div id="main">
  <!-- ── Form Panel ── -->
  <div id="form-panel">

    <!-- From -->
    <div class="form-section">
      <h3>Your Business</h3>
      <div style="margin-bottom:8px">
        <label style="font-size:11px;font-weight:500;color:#6b7280;display:block;margin-bottom:4px">Logo (optional)</label>
        <div id="logo-area" onclick="document.getElementById('logo-input').click()">
          <img id="logo-preview" alt="logo"/>
          <span id="logo-placeholder">📁 Click to upload logo</span>
        </div>
        <input type="file" id="logo-input" accept="image/*" onchange="uploadLogo(this)"/>
      </div>
      <div class="field"><label>Business / Your Name</label><input type="text" id="f-from-name" value="Your Business Name" oninput="render()"/></div>
      <div class="field"><label>Address</label><textarea id="f-from-addr" oninput="render()" rows="2">123 Main Street, City, State 00000</textarea></div>
      <div class="row2">
        <div class="field"><label>Phone</label><input type="text" id="f-from-phone" value="+1 (555) 000-0000" oninput="render()"/></div>
        <div class="field"><label>Email</label><input type="email" id="f-from-email" value="hello@yourbusiness.com" oninput="render()"/></div>
      </div>
      <div class="field"><label>Website (optional)</label><input type="text" id="f-from-web" placeholder="www.yourbusiness.com" oninput="render()"/></div>
    </div>

    <!-- To -->
    <div class="form-section">
      <h3>Bill To</h3>
      <div class="field"><label>Client Name</label><input type="text" id="f-to-name" value="Client Name" oninput="render()"/></div>
      <div class="field"><label>Address</label><textarea id="f-to-addr" oninput="render()" rows="2">456 Client Ave, City, State 00000</textarea></div>
      <div class="row2">
        <div class="field"><label>Email</label><input type="email" id="f-to-email" placeholder="client@email.com" oninput="render()"/></div>
        <div class="field"><label>Phone</label><input type="text" id="f-to-phone" placeholder="(optional)" oninput="render()"/></div>
      </div>
    </div>

    <!-- Invoice details -->
    <div class="form-section">
      <h3>Invoice Details</h3>
      <div class="row2">
        <div class="field"><label>Invoice #</label><input type="text" id="f-inv-num" value="INV-001" oninput="render()"/></div>
        <div class="field"><label>PO Number</label><input type="text" id="f-po" placeholder="(optional)" oninput="render()"/></div>
      </div>
      <div class="row2">
        <div class="field"><label>Invoice Date</label><input type="date" id="f-date" oninput="render()"/></div>
        <div class="field"><label>Due Date</label><input type="date" id="f-due" oninput="render()"/></div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Currency</label>
          <select id="f-currency" onchange="render()">
            <option value="$">USD ($)</option>
            <option value="€">EUR (€)</option>
            <option value="£">GBP (£)</option>
            <option value="₱">PHP (₱)</option>
            <option value="¥">JPY (¥)</option>
            <option value="₩">KRW (₩)</option>
            <option value="A$">AUD (A$)</option>
            <option value="C$">CAD (C$)</option>
            <option value="S$">SGD (S$)</option>
            <option value="AED">AED</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="f-status" onchange="render()">
            <option value="unpaid">Unpaid</option>
            <option value="paid">Paid</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Line items -->
    <div class="form-section">
      <h3>Line Items</h3>
      <table id="items-table">
        <thead>
          <tr>
            <th style="width:44%">Description</th>
            <th style="width:12%">Qty</th>
            <th style="width:20%">Unit Price</th>
            <th style="width:18%">Amount</th>
            <th style="width:6%"></th>
          </tr>
        </thead>
        <tbody id="items-tbody"></tbody>
      </table>
      <button id="add-item-btn" onclick="addItem()">+ Add Line Item</button>
    </div>

    <!-- Totals config -->
    <div class="form-section">
      <h3>Totals</h3>
      <div class="row2">
        <div class="field"><label>Discount %</label><input type="number" id="f-discount" min="0" max="100" value="0" oninput="render()"/></div>
        <div class="field"><label>Tax %</label><input type="number" id="f-tax" min="0" max="100" value="0" oninput="render()"/></div>
      </div>
      <div class="field"><label>Shipping / Handling</label><input type="number" id="f-shipping" min="0" value="0" step="0.01" oninput="render()"/></div>
    </div>

    <!-- Notes -->
    <div class="form-section">
      <h3>Notes & Terms</h3>
      <div class="field"><textarea id="f-notes" rows="3" placeholder="Payment terms, bank details, thank you message..." oninput="render()">Thank you for your business! Payment is due within 30 days.</textarea></div>
    </div>

    <!-- Accent color -->
    <div class="form-section">
      <h3>Accent Color</h3>
      <div class="color-row" id="color-row"></div>
    </div>

  </div>

  <!-- ── Invoice Preview ── -->
  <div id="preview-wrap">
    <div id="invoice">
      <!-- Rendered by JS -->
    </div>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let lineItems = [
  {desc:'Service / Product Name', qty:1, price:0},
  {desc:'', qty:1, price:0},
];
let logoBase64 = null;
let accentColor = '#1e3a5f';

const ACCENTS = ['#1e3a5f','#1e40af','#1e6f4f','#7c2d12','#4a1d96','#831843','#374151','#b45309','#0f766e','#be185d'];

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', ()=>{
  // Set today & +30 days
  const today=new Date();
  const due=new Date(today); due.setDate(due.getDate()+30);
  document.getElementById('f-date').value=today.toISOString().slice(0,10);
  document.getElementById('f-due').value=due.toISOString().slice(0,10);

  buildColorPicker();
  rebuildItemsTable();
  render();
});

// ─── Colors ───────────────────────────────────────────────────────────────────
function buildColorPicker(){
  const row=document.getElementById('color-row');
  ACCENTS.forEach(c=>{
    const btn=document.createElement('div');
    btn.className='color-swatch'+(c===accentColor?' active':'');
    btn.style.background=c;
    btn.onclick=()=>{
      accentColor=c;
      document.querySelectorAll('.color-swatch').forEach(s=>s.classList.toggle('active',s.style.background===hexToRgb(c)||s===btn));
      document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
      btn.classList.add('active');
      render();
    };
    row.appendChild(btn);
  });
}
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${r}, ${g}, ${b})`;}

// ─── Logo ─────────────────────────────────────────────────────────────────────
function uploadLogo(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    logoBase64=e.target.result;
    const img=document.getElementById('logo-preview');
    img.src=logoBase64; img.style.display='block';
    document.getElementById('logo-placeholder').style.display='none';
    render();
  };
  reader.readAsDataURL(file);
}

// ─── Line items table ─────────────────────────────────────────────────────────
function addItem(){
  lineItems.push({desc:'',qty:1,price:0});
  rebuildItemsTable(); render();
}

function removeItem(idx){
  lineItems.splice(idx,1);
  if(lineItems.length===0) lineItems.push({desc:'',qty:1,price:0});
  rebuildItemsTable(); render();
}

function rebuildItemsTable(){
  const tbody=document.getElementById('items-tbody');
  tbody.innerHTML='';
  lineItems.forEach((item,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><input type="text" value="${esc(item.desc)}" placeholder="Description" oninput="lineItems[${i}].desc=this.value;render()"/></td>
      <td><input type="number" value="${item.qty}" min="0" step="any" oninput="lineItems[${i}].qty=+this.value;render()" style="text-align:center"/></td>
      <td><input type="number" value="${item.price}" min="0" step="0.01" oninput="lineItems[${i}].price=+this.value;render()" style="text-align:right"/></td>
      <td style="text-align:right;font-weight:500;font-size:12px;padding-right:6px" id="amt-${i}"></td>
      <td><button class="item-del" onclick="removeItem(${i})" title="Remove">×</button></td>
    `;
    tbody.appendChild(tr);
  });
  updateAmounts();
}

function updateAmounts(){
  lineItems.forEach((item,i)=>{
    const el=document.getElementById('amt-'+i);
    if(el) el.textContent=fmt(item.qty*item.price);
  });
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}

// ─── Formatting ───────────────────────────────────────────────────────────────
function fmt(v){
  const sym=document.getElementById('f-currency').value;
  return sym+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtDate(d){ if(!d) return ''; const dt=new Date(d+'T00:00'); return dt.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }

// ─── Render invoice ───────────────────────────────────────────────────────────
function render(){
  updateAmounts();
  const subtotal=lineItems.reduce((s,i)=>s+i.qty*i.price,0);
  const discount=parseFloat(document.getElementById('f-discount').value)||0;
  const tax=parseFloat(document.getElementById('f-tax').value)||0;
  const shipping=parseFloat(document.getElementById('f-shipping').value)||0;
  const discountAmt=subtotal*(discount/100);
  const afterDiscount=subtotal-discountAmt;
  const taxAmt=afterDiscount*(tax/100);
  const total=afterDiscount+taxAmt+shipping;

  const status=document.getElementById('f-status').value;
  const invNum=document.getElementById('f-inv-num').value;
  const poNum=document.getElementById('f-po').value;

  const fromName=document.getElementById('f-from-name').value;
  const fromAddr=document.getElementById('f-from-addr').value.replace(/\n/g,'<br>');
  const fromPhone=document.getElementById('f-from-phone').value;
  const fromEmail=document.getElementById('f-from-email').value;
  const fromWeb=document.getElementById('f-from-web').value;

  const toName=document.getElementById('f-to-name').value;
  const toAddr=document.getElementById('f-to-addr').value.replace(/\n/g,'<br>');
  const toEmail=document.getElementById('f-to-email').value;
  const toPhone=document.getElementById('f-to-phone').value;

  const invDate=fmtDate(document.getElementById('f-date').value);
  const dueDate=fmtDate(document.getElementById('f-due').value);
  const notes=document.getElementById('f-notes').value;

  const logoHTML = logoBase64
    ? `<img src="${logoBase64}" alt="logo" style="max-height:80px;max-width:200px;object-fit:contain"/>`
    : `<div class="inv-company-name">${fromName}</div>`;

  const lineRows=lineItems.map(item=>{
    if(!item.desc && !item.price) return '';
    return `<tr>
      <td class="desc">${item.desc||''}</td>
      <td style="text-align:center">${item.qty}</td>
      <td style="text-align:right">${fmt(item.price)}</td>
      <td class="amount" style="text-align:right">${fmt(item.qty*item.price)}</td>
    </tr>`;
  }).join('');

  const discountRow=discount>0?`<tr><td>Discount (${discount}%)</td><td>-${fmt(discountAmt)}</td></tr>`:'';
  const taxRow=tax>0?`<tr><td>Tax (${tax}%)</td><td>${fmt(taxAmt)}</td></tr>`:'';
  const shippingRow=shipping>0?`<tr><td>Shipping &amp; Handling</td><td>${fmt(shipping)}</td></tr>`:'';
  const poRow=poNum?`<tr><td>PO Number</td><td class="val">${poNum}</td></tr>`:'';

  document.getElementById('invoice').style.setProperty('--accent',accentColor);
  document.getElementById('invoice').innerHTML=`
    <div class="inv-header">
      <div class="inv-logo-area">${logoHTML}</div>
      <div class="inv-title">
        <h2>INVOICE</h2>
        <div class="inv-meta">
          <table>
            <tr><td>Invoice #</td><td class="val">${invNum}</td></tr>
            ${poRow}
            <tr><td>Date</td><td class="val">${invDate}</td></tr>
            <tr><td>Due Date</td><td class="val">${dueDate}</td></tr>
          </table>
        </div>
      </div>
    </div>

    <div class="inv-addresses">
      <div class="inv-addr">
        <h4>From</h4>
        <div class="name">${fromName}</div>
        <p>${fromAddr}<br>${fromPhone?fromPhone+'<br>':''} ${fromEmail}${fromWeb?'<br>'+fromWeb:''}</p>
      </div>
      <div class="inv-addr">
        <h4>Bill To</h4>
        <div class="name">${toName}</div>
        <p>${toAddr}${toEmail?'<br>'+toEmail:''}${toPhone?'<br>'+toPhone:''}</p>
      </div>
    </div>

    <table class="inv-table">
      <thead>
        <tr>
          <th style="width:50%;text-align:left">Description</th>
          <th style="width:10%;text-align:center">Qty</th>
          <th style="width:20%;text-align:right">Unit Price</th>
          <th style="width:20%;text-align:right">Amount</th>
        </tr>
      </thead>
      <tbody>${lineRows}</tbody>
    </table>

    <div class="inv-totals">
      <table>
        <tr><td>Subtotal</td><td>${fmt(subtotal)}</td></tr>
        ${discountRow}${taxRow}${shippingRow}
        <tr class="total-row"><td>Total Due</td><td>${fmt(total)}</td></tr>
      </table>
    </div>

    ${notes?`<div class="inv-notes"><h4>Notes &amp; Terms</h4><p>${notes}</p></div>`:''}

    <div class="inv-footer">
      <p>${fromName} &nbsp;·&nbsp; ${fromEmail}</p>
      <span class="inv-status ${status==='paid'?'status-paid':'status-unpaid'}">${status.toUpperCase()}</span>
    </div>
  `;
}

// ─── PDF Export ───────────────────────────────────────────────────────────────
function downloadPDF(){
  // Show helpful instruction
  const orig=document.getElementById('btn-pdf').textContent;
  document.getElementById('btn-pdf').textContent='Printing... (choose "Save as PDF")';
  setTimeout(()=>{
    window.print();
    setTimeout(()=>{ document.getElementById('btn-pdf').textContent=orig; },2000);
  },100);
}

function newInvoice(){
  if(!confirm('Start a new invoice? This will clear the current one.')) return;
  lineItems=[{desc:'',qty:1,price:0}];
  logoBase64=null;
  document.getElementById('logo-preview').style.display='none';
  document.getElementById('logo-placeholder').style.display='';
