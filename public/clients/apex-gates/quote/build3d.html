<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17171a">
<title>Apex Gate Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d61d09'/%3E%3Cpath d='M7 25V9M25 25V9M7 12h18M7 21h18M11 12v9M15 12v9M19 12v9M23 12v9' stroke='%23fff' stroke-width='2.2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700;62..125,800&family=Inter:wght@400;500;600;700&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--red:#d61d09;--red2:#b01606;--ink:#17171a;--ink2:#3f3e41;--mut:#6c727a;--line:#e2e4e8;--bg:#f4f4f2;--card:#fff;--ok:#1f9d55;--head:'Archivo',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--side:430px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
button,input,select{font:inherit;color:inherit}
.top{height:54px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
.logo{display:flex;align-items:center;gap:10px;font:800 17px var(--head);font-stretch:115%;letter-spacing:.05em;color:#fff;text-decoration:none}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-style:normal;font-size:15px}
.logo small{font:600 11px var(--body);letter-spacing:.02em;color:#a3a3a8;font-stretch:100%;margin-left:4px}
.top .sp{flex:1}
.top a.lk{color:#c9c9cc;text-decoration:none;font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px}
.top a.lk:hover{background:#2a2a2e;color:#fff}
#total{text-align:right;line-height:1.1}
#total b{display:block;font:800 19px var(--head);font-stretch:105%}
#total small{color:#a3a3a8;font-size:11px}
.app{display:grid;grid-template-columns:1fr var(--side);height:calc(100% - 54px)}
.work{display:grid;grid-template-rows:1fr 290px;min-width:0;min-height:0;border-right:1px solid var(--line)}
.vwrap{position:relative;min-height:0;overflow:hidden}
#three{position:absolute;inset:0}
#three canvas{display:block;touch-action:none}
#vtools{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}
#vtools button,.exw{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06)}
#vtools button:hover{border-color:#c4c7cc}
#vtools button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#vtools button.red{background:var(--red);color:#fff;border-color:var(--red)}
.exw{display:flex;align-items:center;gap:8px;cursor:default}
.exw input{width:110px;accent-color:var(--red)}
#tip{position:absolute;pointer-events:none;background:rgba(23,23,26,.94);color:#fff;border-radius:9px;padding:8px 11px;font-size:12px;max-width:280px;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:3}
#tip b{display:block;font-size:13px}
#tip span{display:block;color:#c9c9cc}
.legend{position:absolute;right:12px;bottom:10px;background:rgba(255,255,255,.9);border-radius:9px;padding:6px 10px;font-size:11.5px;color:var(--mut)}
.pwrap{display:grid;grid-template-rows:auto 1fr;min-height:0;background:#fbfbfa;border-top:1px solid var(--line)}
#ptools{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
#ptools button,#ptools select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
#ptools button.on{background:var(--red);border-color:var(--red);color:#fff}
#ptools button.dang{margin-left:auto;color:var(--red)}
#plan{width:100%;height:100%;display:block;touch-action:none;min-height:0}
.side{display:grid;grid-template-rows:auto 1fr;min-height:0;background:var(--card)}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;background:none;padding:13px 6px;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
#tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
#panel{overflow:auto;padding:16px 16px 40px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.phead small{color:var(--mut);font-size:12px}
.phead h2{margin:0;font:800 22px var(--head);font-stretch:105%}
.pp{text-align:right}.pp b{display:block;font:800 20px var(--head)}.pp small{color:var(--mut);font-size:11px}
.types{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.types button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.types button i{width:9px;height:9px;border-radius:2px;display:inline-block}
.types button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
h4{margin:18px 0 6px;font:800 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-stretch:110%}
.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.fld input,.fld select,.row2 input{width:100%;border:1px solid #d6d8dc;border-radius:9px;padding:9px 11px;background:#fff;font-size:14px}
.fld input:focus,.fld select:focus,.row2 input:focus{outline:2px solid var(--red);outline-offset:0;border-color:var(--red)}
.numw{display:flex;align-items:center;border:1px solid #d6d8dc;border-radius:9px;background:#fff;overflow:hidden}
.numw input{border:0!important;outline:0!important;flex:1;min-width:0}
.numw em{font-style:normal;color:var(--mut);font-size:12px;padding:0 11px}
.numw.big input{font:800 20px var(--head);padding:8px 11px}
.numw:focus-within{outline:2px solid var(--red);border-color:var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;border:1px solid #d6d8dc;background:#fff;border-radius:8px;padding:7px 9px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--red);color:#fff;border-color:var(--red)}
.tog{display:flex;align-items:center;gap:10px;margin:0 0 9px;cursor:pointer;font-weight:600;font-size:13px}
.tog input{display:none}
.tog i{width:36px;height:21px;border-radius:999px;background:#d6d8dc;position:relative;flex:none;transition:.15s}
.tog i:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}
.tog input:checked+i{background:var(--ok)}
.tog input:checked+i:after{left:18px}
.sw{display:flex;flex-wrap:wrap;gap:5px;margin:-4px 0 12px}
.sw button{width:24px;height:24px;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 1px #d6d8dc;cursor:pointer}
.sw button.on{box-shadow:0 0 0 2px var(--red)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.acts.col{flex-direction:column}
.btn{border:1px solid #d6d8dc;background:#fff;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:#b9bcc1}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.ghost{color:var(--red)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red2)}
.warn{background:#fff4e5;border:1px solid #ffd9a8;color:#7a4a00;border-radius:9px;padding:8px 11px;margin:0 0 8px;font-size:12.5px}
.warn.err{background:#fde8e5;border-color:#f6b8ad;color:#8a1606}
.kg{color:var(--mut);font-size:12.5px;margin:0 0 6px}
.empty{padding:30px 6px;color:var(--mut)}
.empty b{color:var(--ink);font-size:16px;display:block;margin-bottom:6px}
.hint{color:var(--mut);font-size:12px;margin:0 0 10px}
.scope{display:flex;gap:4px;margin-bottom:8px;background:#f0f1f2;border-radius:10px;padding:3px}
.scope button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--mut)}
.scope button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
table.parts{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.parts th{text-align:left;font-size:11px;color:var(--mut);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.parts td{padding:7px 6px;border-bottom:1px solid #f0f1f2;vertical-align:top}
.parts td small{display:block;color:var(--mut);font-size:11px}
.parts td small.pc{color:#a0623a}
.parts .n{text-align:right;white-space:nowrap}
.parts .cost{color:#7d828a}
.parts tr.g td{background:#f6f6f4;font:800 10.5px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:5px 6px}
.parts tbody tr[data-part]{cursor:pointer}
.parts tbody tr[data-part]:hover{background:#fafafa}
.parts tbody tr.on{background:#fde8e5}
.parts tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.parts tfoot td{font-weight:800;padding-top:10px;border:0}
.parts.small td{padding:4px 6px}
.pack{margin-bottom:18px}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.ph span{color:var(--mut);font-size:12px;text-align:right}
.bar{display:flex;height:22px;background:repeating-linear-gradient(45deg,#eceae6,#eceae6 4px,#f6f5f2 4px,#f6f5f2 8px);border-radius:4px;margin-bottom:3px;overflow:hidden}
.bar i{background:#3f3e41;border-right:2px solid #fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bar i:nth-child(3n+2){background:#5a595d}.bar i:nth-child(3n){background:#d61d09}
.bar i span{color:#fff;font-size:9.5px;font-style:normal;font-weight:700;white-space:nowrap}
.tot{background:#f6f6f4;border-radius:12px;padding:12px 14px;margin:12px 0}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-size:17px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.tot .big b{font:800 22px var(--head)}
.tot .prof{color:var(--ok);font-weight:600}
.tot .sm{color:var(--mut);font-size:12px}
#say{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;transition:.2s;z-index:9;pointer-events:none}
#say.on{opacity:1;transform:translate(-50%,0)}
#print{display:none}
body:not(.office) .cost{display:none}
@media (max-width:980px){
  html,body{height:auto}
  .app{display:block;height:auto}
  .work{grid-template-rows:56vh 300px;border:0}
  .side{min-height:70vh}
  #panel{overflow:visible}
  .logo small{display:none}
  .top a.lk{display:none}
}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;font-size:11px;color:#000}
  #print h1{font:800 20px var(--head);margin:0 0 4px}
  #print .imgs{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin:8px 0}
  #print img{width:100%;border:1px solid #ccc}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{border-bottom:1px solid #ddd;padding:3px 5px;text-align:left}
  #print .n{text-align:right}
  #print tr.pc td{font-weight:800;font-size:12.5px;padding-top:10px;border-bottom:2px solid #000}
  #print tr.g td{font-weight:700;color:#555;text-transform:uppercase;font-size:9.5px}
  #print td.tick{width:40px;border:1px solid #bbb}
  #print .tot{font-size:13px;margin-top:10px}
}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="build3d.html"><i>A</i>GATE BUILDER<small>3D, part by part</small></a>
  <span class="sp"></span>
  <a class="lk" href="index.html">Apex Quote</a>
  <a class="lk" href="admin.html">CEO dashboard</a>
  <div id="total"></div>
</header>
<div class="app">
  <section class="work">
    <div class="vwrap">
      <div id="three"></div>
      <div id="vtools">
        <button data-v="open">Open gates</button>
        <label class="exw">Apart <input id="explode" type="range" min="0" max="100" value="0" aria-label="Pull the parts apart"></label>
        <button data-v="under">See underground</button>
        <button data-v="dims" class="on">Labels</button>
        <button data-v="three">3D</button><button data-v="front">Street</button><button data-v="inside">Inside</button><button data-v="top">Top</button><button data-v="piece" class="red">This piece</button>
      </div>
      <div id="tip" hidden></div>
      <div class="legend">Drag to turn, scroll to zoom. Tap a part to price it.</div>
    </div>
    <div class="pwrap">
      <div id="ptools"></div>
      <canvas id="plan"></canvas>
    </div>
  </section>
  <aside class="side">
    <nav id="tabs"></nav>
    <div id="panel"></div>
  </aside>
</div>
<datalist id="colours"></datalist>
<div id="say" role="status"></div>
<div id="print"></div>
<script type="module" src="build3d.js?v=1"></script>
</body>
</html>
