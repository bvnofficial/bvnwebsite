<!doctype html>
<html lang="en-AU">
<head>

<title>Apex Gates HQ</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
// load the files next to this page, whether or not the address ends in a slash
window.HQ_V = "6"; // bump on each deploy so browsers load fresh files
window.HQ_BASE = location.pathname.endsWith("/") || location.pathname.endsWith(".html") ? "" : location.pathname.split("/").pop() + "/";
document.write('<link rel="stylesheet" href="' + HQ_BASE + 'styles.css?v=' + HQ_V + '">');
</script>
</head>
<body>
<div id="app"><div class="boot">Loading Apex Gates HQ</div></div>
<div id="modal" class="modal" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
["data.js", "core.js", "ceo.js", "staff.js", "client.js"].forEach(function (f) {
  document.write('<script src="' + HQ_BASE + f + '?v=' + HQ_V + '"><\/script>');
});
</script>
</body>
</html>
