<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111316">
<title>Revolution HQ | Revolution Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--or:#E86010;--or-d:#C94F08;--or-s:#FDEFE6;--ink:#111316;--ink2:#1B1E23;--bg:#F3F4F6;--card:#fff;--line:#E3E5E9;--line2:#EEF0F3;--text:#16191D;--mut:#6B717A;--faint:#9AA0A8;
--ok:#0E9F6E;--ok-s:#E3F6EE;--warn:#B45309;--warn-s:#FEF3E2;--bad:#C8261B;--bad-s:#FDECEA;--blue:#2563EB;--blue-s:#E8F0FE;--r:14px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--sh2:0 18px 48px rgba(16,24,40,.22)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15}h1{font-size:24px;font-weight:800}h3{font-size:15px;font-weight:700}
.mut{color:var(--mut)}.faint{color:var(--faint)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:600}.r{text-align:right}.nw{white-space:nowrap}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:600;font-size:13px;line-height:1;min-height:36px;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:#F8F9FA;border-color:#CFD3D9}.btn.pri{background:var(--or);border-color:var(--or);color:#fff}.btn.pri:hover{background:var(--or-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:rgba(0,0,0,.05)}
.btn.s{min-height:28px;padding:5px 9px;font-size:12px;border-radius:8px}.btn svg,.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--line2);color:#3d434b;white-space:nowrap}
.tag.or{background:var(--or-s);color:#A8440A}.tag.ok{background:var(--ok-s);color:#08724F}.tag.warn{background:var(--warn-s);color:var(--warn)}.tag.bad{background:var(--bad-s);color:var(--bad)}.tag.blue{background:var(--blue-s);color:#1D4FC4}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}.inp:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(232,96,16,.15)}
/* layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#c9ced6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff}
.brand .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#ff8a3d,var(--or));display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.02em}
.brand b{display:block;font-size:14px;line-height:1.1}.brand small{font-size:11px;color:#8a919c}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b727c;padding:14px 10px 6px;font-weight:700}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#c9ced6;padding:9px 10px;border-radius:9px;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}.nav button.on{background:rgba(232,96,16,.16);color:#fff}.nav button.on svg{color:var(--or)}
.nav .bdg{margin-left:auto;background:var(--or);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.sync{margin-top:auto;font-size:12px;padding:12px 10px;border-top:1px solid rgba(255,255,255,.08)}
.sync div{display:flex;align-items:center;gap:8px;margin:4px 0}.sync i{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.sync a{color:#8a919c;text-decoration:none}.sync a:hover{color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 26px;background:rgba(243,244,246,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top .srch{position:relative;width:min(340px,30vw)}.top .srch svg{position:absolute;left:11px;top:11px;color:var(--faint)}.top .srch input{padding-left:34px}
.demo{font-size:11px;font-weight:700;letter-spacing:.06em;color:#0E9F6E;background:#E7F6EF;padding:4px 9px;border-radius:999px}
.bell{position:relative}.bell .n{position:absolute;top:2px;right:2px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.npanel{position:absolute;right:0;top:44px;width:340px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);z-index:40;max-height:420px;overflow:auto}
.page{padding:22px 26px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-width:0}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}.ch h3{flex:1}.cb{padding:14px 16px}
.g{display:grid;gap:16px}.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.brief{background:linear-gradient(120deg,#16191d 0%,#22180f 100%);color:#e7e9ee;border:0;padding:20px 22px;position:relative;overflow:hidden}
.brief:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(232,96,16,.35),transparent 70%)}
.brief .tag{background:rgba(232,96,16,.2);color:#ffb27f}.brief h2{font-size:24px;margin:10px 0 6px;color:#fff}.brief p{margin:0;max-width:860px;color:#c3c8d0;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{padding:14px 15px;cursor:pointer;transition:transform .15s,box-shadow .15s}.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,24,40,.1)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:500}.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px}.kpi .d{font-size:12px;color:var(--mut)}.kpi .d.up{color:var(--ok)}.kpi .d.dn{color:var(--bad)}
.kpi.flash{animation:flash 1.6s}@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--or)}100%{box-shadow:var(--sh)}}
/* charts */
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:16px;border-bottom:1px solid var(--line)}
.bars .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;cursor:default}
.bars .c i{display:block;width:70%;max-width:30px;background:#F2B48C;border-radius:4px 4px 0 0;min-height:3px;transition:height .6s}
.bars .c.cur i{background:var(--or)}.bars .c:hover i{filter:brightness(.92)}
.bars .c em{font-style:normal;font-size:11px;color:var(--mut);margin-bottom:4px;font-weight:600}
.blab{display:flex;gap:6px;margin-top:6px}.blab span{flex:1;text-align:center;font-size:10.5px;color:var(--faint)}
.hb{display:grid;grid-template-columns:minmax(110px,150px) 1fr 52px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hb .tr{height:10px;background:var(--line2);border-radius:999px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--or);border-radius:999px}
.hb.ok .tr i{background:var(--ok)}.hb b{text-align:right}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line2);cursor:pointer}.li:first-child{border-top:0}.li:hover{background:#FAFAFB}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.feed .fi{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}.feed .fi:first-child{border-top:0}.feed .t{margin-left:auto;color:var(--faint);font-size:11.5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--or);flex:none;margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFAFB;white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}.tbl tr.ck:hover td{background:#FAFAFB;cursor:pointer}.tbl tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
/* inbox */
.inbox{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 69px)}
.ilist{border-right:1px solid var(--line);background:#fff;overflow:auto}
.ci{padding:13px 16px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;gap:11px}.ci:hover{background:#FAFAFB}.ci.on{background:var(--or-s)}
.ci .p{font-size:12.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ci.unread b{font-weight:800}.ci.unread .p{color:var(--text)}
.thread{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.th{padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.m{max-width:min(560px,80%);padding:10px 13px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:13.5px;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink)}.m small{display:block;font-size:10.5px;opacity:.6;margin-top:5px}
.m.sys{align-self:center;background:transparent;border:1px dashed #cfd3d9;color:var(--mut);font-size:12px;max-width:90%}
.rfqbox{border:1px solid #F2C3A4;background:#FFF8F3;border-radius:12px;padding:10px 12px;margin-top:6px;font-size:12.5px;color:var(--text)}
.ai{margin:0 20px 10px;border:1px solid #F2C3A4;background:#FFF8F3;border-radius:12px;padding:11px 13px;font-size:13px}
.ai .tag{background:var(--or);color:#fff}
.comp{display:flex;gap:8px;padding:12px 20px 18px;background:#fff;border-top:1px solid var(--line)}.comp textarea{resize:none;height:44px}
/* pipeline */
.kan{display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:#E9EBEF;border-radius:14px;padding:10px;min-height:300px;transition:background .15s}.col.over{background:#F8DCC8}
.col h4{margin:2px 4px 10px;font-size:12.5px;display:flex;gap:8px;align-items:center}.col h4 span{color:var(--mut);font-weight:500}
.op{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:grab;box-shadow:var(--sh);transition:transform .12s}.op:hover{transform:translateY(-1px)}
.op.drag{opacity:.4}.op .v{font-weight:800;font-size:15px}
/* modal */
.mod{position:fixed;inset:0;background:rgba(10,12,16,.5);display:grid;place-items:center;z-index:60;padding:16px;animation:fade .15s}
.mod .box{background:#fff;border-radius:18px;width:min(860px,100%);max-height:92vh;overflow:auto;box-shadow:var(--sh2)}
.mh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#fff;z-index:2}.mh h2{font-size:19px;flex:1}
.mb{padding:18px 22px}.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:#fff;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
.qtbl input{width:96px;text-align:right;padding:6px 8px}
.tot{display:flex;justify-content:flex-end;gap:30px;padding:12px 14px;font-size:14px}.tot b{font-size:20px}
/* invoices and reports */
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.inv{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:#fff}
.inv .ih{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}.inv .ih .no{font-size:22px;font-weight:800;letter-spacing:-.02em}
.paybox{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--ok-s);color:#08724F;font-size:13px}
.paybox.bad{background:var(--bad-s);color:var(--bad)}.paybox.warn{background:var(--warn-s);color:var(--warn)}
.bars.money .c em{font-size:10.5px}
.tbl th.r{text-align:right}.wide .hb{grid-template-columns:minmax(150px,220px) 1fr 52px}
/* toasts */
.toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 15px;font-size:13.5px;box-shadow:var(--sh2);max-width:360px;animation:tin .3s;display:flex;gap:10px;align-items:flex-start}
.toast.or{background:linear-gradient(135deg,#ff7a2a,var(--or))}@keyframes tin{from{opacity:0;transform:translateY(12px)}}
.phone{position:fixed;top:16px;right:18px;z-index:85;width:330px;background:rgba(250,250,252,.97);backdrop-filter:blur(14px);border-radius:18px;box-shadow:var(--sh2);padding:12px 14px;display:flex;gap:11px;animation:pin .45s cubic-bezier(.2,.9,.3,1.2)}
.phone .ic{width:38px;height:38px;border-radius:10px;background:#22c55e;display:grid;place-items:center;color:#fff;flex:none}
@keyframes pin{from{opacity:0;transform:translateY(-40px)}}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;z-index:90;white-space:nowrap;display:none}
.empty{padding:30px;text-align:center;color:var(--mut)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;animation:pl 1.4s infinite}@keyframes pl{0%{box-shadow:0 0 0 0 currentColor}100%{box-shadow:0 0 0 8px transparent}}
.new{animation:newrow 2.4s}@keyframes newrow{0%,50%{background:#FFE7D6}}
.seg{display:inline-flex;background:#E9EBEF;border-radius:10px;padding:3px}.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--mut)}.seg button.on{background:#fff;color:var(--text);box-shadow:var(--sh)}
.mbar{display:none}
@media(max-width:1280px){.kpis{grid-template-columns:repeat(3,1fr)}.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1000px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:70;transform:translateX(-100%);transition:transform .25s}.side.open{transform:none;box-shadow:var(--sh2)}
 .mbar{display:inline-flex}.top{padding:12px 14px;gap:8px}.top h1{font-size:19px}.top .srch{display:none}.page{padding:14px 14px 70px}
 .kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.inv{padding:14px}.inv .ih{flex-wrap:wrap}.kpi .v{font-size:21px}.li .btn{display:none}.brief h2{font-size:20px}.inbox{grid-template-columns:1fr;height:auto}.inbox.sel .ilist{display:none}.inbox:not(.sel) .thread{display:none}.thread{min-height:calc(100vh - 62px)}
 .phone{left:12px;right:12px;width:auto}.demo{display:none}.top .newbtn span{display:none}
}
.gtag{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.loading{display:grid;place-items:center;min-height:100vh;color:#6b7280;font:600 15px Inter,system-ui,sans-serif;padding:20px;text-align:center}
.pipesel{font:inherit;font-size:13px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:#fff}
.liveempty{padding:22px;color:#6b7280;font-size:14px}
.srcl{padding:6px 16px}.srci{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line2)}.srci:last-child{border-bottom:0}.srcn{width:22px;flex:none;padding-top:9px;color:var(--mut);font-size:12px;font-weight:600}.srcf{display:grid;gap:8px;min-width:0}.srcf .srch{font-weight:700}.srcf textarea{resize:vertical;min-height:70px;line-height:1.5;font:inherit;font-size:13.5px}.srcb{display:flex;gap:4px;flex:none;padding-top:4px}.btn[disabled]{opacity:.45;cursor:default}@media(max-width:640px){.srci{flex-wrap:wrap}.srcb{width:100%;justify-content:flex-end}}
</style>
</head>
<body>
<div id="app"></div>
<div id="mod"></div>
<div class="toasts" id="toasts"></div>
<div class="tip" id="tip"></div>
<script>
(function(){
"use strict";
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Math.round(n).toLocaleString("en-AU");
const money2=n=>"$"+n.toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
const kfmt=n=>n>=1000?"$"+(n/1000).toFixed(n>=100000?0:1).replace(/\.0$/,"")+"k":money(n);
const MIN=60000,HR=60*MIN,DAY=24*HR;
const now=()=>Date.now();
const rel=t=>{const d=now()-t;if(d<MIN)return"just now";if(d<HR)return Math.floor(d/MIN)+" min ago";if(d<DAY)return Math.floor(d/HR)+" hr ago";const n=Math.floor(d/DAY);return n===1?"yesterday":n+" days ago"};
const clock=t=>new Date(t).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"});
const COLORS=["#E86010","#2563EB","#0E9F6E","#7C3AED","#B45309","#0891B2","#BE185D","#4B5563"];
const avatar=(name,i)=>`<span class="av" style="background:${COLORS[(i||name.length)%COLORS.length]}">${esc(name.split(" ").map(w=>w[0]).slice(0,2).join(""))}</span>`;

function setStages(){const p=(LIVE.pipelines||[]).find(x=>x.id===PIPE);STAGES=(p?p.stages.map(s=>s.name):[]).filter(n=>n!=="Won"&&n!=="Lost").concat(["Won","Lost"])}
function adopt(d){
  LIVE=d;
  const pls=d.pipelines||[],pref=(d.preferredPipeline||"").toLowerCase();
  let saved=null;try{saved=localStorage.getItem("rmhq-pipe")}catch(x){}
  const count=id=>d.opps.filter(o=>o.pipelineId===id).length;
  PIPE=(pls.find(p=>p.id===saved)||pls.find(p=>pref&&p.name.toLowerCase().includes(pref))||pls.find(p=>/enquir|rfq|quote|sales/i.test(p.name))||pls.slice().sort((a,b)=>count(b.id)-count(a.id))[0]||{}).id||null;
  setStages();
  S.contacts=d.contacts;
  S.opps=d.opps.map(o=>{const won=o.status==="won",lost=/lost|abandon/.test(o.status);return Object.assign({},o,{stage:won?"Won":lost?"Lost":o.stage,won:won?o.changed:null,lost:lost?"Marked lost in GoHighLevel.":null,certs:[],lines:[{d:o.title,g:"",qty:1,u:"",p:o.value}]})});
  S.convos=d.convos.map(v=>Object.assign({},v,{o:(S.opps.filter(o=>o.c===v.c).sort((a,b)=>b.at-a.at)[0]||{}).id||null,ai:""}));
  S.invoices=d.invoices.map(v=>Object.assign({},v,{lines:v.lines.length?v.lines.map(l=>({d:l.d,g:"",qty:l.qty,u:"",p:l.p})):[{d:v.title,g:"",qty:1,u:"",p:v.total}]}));
  const N=[];
  S.convos.forEach(v=>{const m=last(v);if(m)N.push({text:`${v.unread?"New ":""}${v.ch==="Missed call"?"missed call":v.ch+" message"} from ${C(v.c).name}`.replace(/^n/,"N").replace(/^m/,"M"),at:m.at,go:"inbox/"+v.id,unread:v.unread})});
  S.opps.forEach(o=>N.push({text:`${o.stage==="Won"?"Won":"New deal"}: ${C(o.c).co}, ${o.title}${o.value?", "+money(o.value):""}`,at:o.stage==="Won"?(o.won||o.at):o.at,go:"pipeline",unread:false}));
  S.contacts.forEach(c=>{if(c.at)N.push({text:`New contact: ${c.name}${c.co!==c.name?", "+c.co:""}`,at:c.at,go:"customers",unread:false})});
  S.invoices.forEach(v=>{if(v.paidAt)N.push({text:`${C(v.c).co} paid ${v.no}, ${money(v.total)}`,at:v.paidAt,go:"invoices",unread:false})});
  S.notices=N.sort((a,b)=>b.at-a.at).slice(0,40);
}
const C=id=>S.contacts.find(c=>c.id===id)||{id,name:"Unknown contact",co:"Unknown contact",role:"",city:"",phone:"",email:"",i:0};
const O=id=>S.opps.find(o=>o.id===id);
const val=o=>o.lines.reduce((a,l)=>a+l.qty*l.p,0);
const ivTot=v=>v.total!=null?v.total:val(v)*1.1;
const ivStatus=v=>v.paidAt?"Paid":v.draft?"Draft":now()>v.due?"Overdue":"Unpaid";
const IV_TAG={Paid:"ok",Draft:"",Overdue:"bad",Unpaid:"warn"};
const dshort=t=>new Date(t).toLocaleDateString("en-AU",{day:"numeric",month:"short"});
const daysLate=v=>Math.floor((now()-v.due)/DAY);
function makeInvoice(o){
  if(S.invoices.some(v=>v.o===o.id))return null;
  const n=Math.max(...S.invoices.map(v=>+v.no.slice(4)))+1;
  const v={no:"INV-"+n,c:o.c,o:o.id,title:o.title,lines:o.lines.map(l=>Object.assign({},l)),issued:now(),due:now()+30*DAY,paidAt:null,draft:true,fresh:true};
  S.invoices.unshift(v);return v;
}
const ui={view:"overview",sel:null,bell:false,q:"",period:"12w",src:null,srcDirty:false,srcBusy:false,srcErr:""};

/* ============ stats ============ */
function stats(){
  const t=now(),o=S.opps;
  const wk=S.contacts.filter(c=>c.at&&t-c.at<7*DAY),prevWk=S.contacts.filter(c=>c.at&&t-c.at>=7*DAY&&t-c.at<14*DAY);
  const open=o.filter(x=>!["Won","Lost"].includes(x.stage));
  const sent=open.filter(x=>/quot|propos/i.test(x.stage));
  const won=o.filter(x=>x.stage==="Won"&&t-(x.won||x.at)<30*DAY);
  const closed=o.filter(x=>["Won","Lost"].includes(x.stage));
  const unrep=S.convos.filter(v=>v.unread);
  const stale=open.filter(x=>/follow/i.test(x.stage)||(/quot|propos/i.test(x.stage)&&t-(x.changed||x.at)>4*DAY));
  return {wk,prevWk,open,sent,won,closed,unrep,stale,openV:open.reduce((a,x)=>a+val(x),0),sentV:sent.reduce((a,x)=>a+val(x),0),wonV:won.reduce((a,x)=>a+val(x),0),rate:closed.length?Math.round(closed.filter(x=>x.stage==="Won").length/closed.length*100):0};
}
function brief(st){
  const h=new Date().getHours();
  const parts=[];
  if(st.unrep.length)parts.push(`${st.unrep.length} ${st.unrep.length===1?"conversation is":"conversations are"} unread, the oldest from ${C(st.unrep.slice().sort((x,y)=>last(x).at-last(y).at)[0].c).name}`);
  else parts.push("Every conversation has been read");
  parts.push(st.open.length?`${st.open.length} open ${st.open.length===1?"deal is":"deals are"} worth ${kfmt(st.openV)}`:"There are no open deals in GoHighLevel yet");
  if(st.stale.length)parts.push(`${st.stale.length} ${st.stale.length===1?"needs":"need"} a follow up`);
  const od=S.invoices.filter(v=>ivStatus(v)==="Overdue");
  if(od.length)parts.push(`${od.length} ${od.length===1?"invoice is":"invoices are"} overdue`);
  return {hi:`Good ${h<12?"morning":h<17?"afternoon":"evening"}, Jim`,txt:parts.join(". ")+`. ${st.wk.length} new ${st.wk.length===1?"contact":"contacts"} came in over the last 7 days.`};
}
function weekly(){const out=[],t=now();for(let i=11;i>=0;i--){const a=t-(i+1)*7*DAY,b=t-i*7*DAY;out.push(S.contacts.filter(c=>c.at>a&&c.at<=b).length)}return out}

/* ---------- reports (computed from live data) ---------- */
function months(){const out=[],d=new Date();for(let i=11;i>=0;i--){const m=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({k:m.getFullYear()*12+m.getMonth(),l:m.toLocaleDateString("en-AU",{month:"short"})})}return out}
const mk=t=>{const d=new Date(t);return d.getFullYear()*12+d.getMonth()};
function rep12(){
  const ms=months(),yr=now()-365*DAY;
  const inv=S.invoices.filter(v=>!v.draft&&v.issued>yr);
  const invM=ms.map(m=>inv.filter(v=>mk(v.issued)===m.k).reduce((a,v)=>a+ivTot(v),0));
  const paidM=ms.map(m=>S.invoices.filter(v=>v.paidAt&&mk(v.paidAt)===m.k).reduce((a,v)=>a+ivTot(v),0));
  const src={};S.opps.filter(o=>o.at>yr).forEach(o=>{const x=src[o.src]||(src[o.src]={n:0,w:0,v:0});x.n++;if(o.stage==="Won"){x.w++;x.v+=val(o)}});
  const srcRows=Object.entries(src).sort((a,b)=>b[1].n-a[1].n);
  const cust={};S.invoices.filter(v=>v.paidAt&&v.paidAt>yr).forEach(v=>{const k=C(v.c).co;cust[k]=(cust[k]||0)+ivTot(v)});
  return {ms,invM,paidM,srcRows,top:Object.entries(cust).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6)};
}

   <div class="bars money">${r.invM.map((v,i)=>`<div class="c ${i===11?"cur":""}" data-tip="${r.ms[i].l}: ${money(v)} invoiced"><em>${v?kfmt(v):""}</em><i style="height:${(v/mx*100).toFixed(1)}%"></i></div>`).join("")}</div>

     <textarea class="inp" data-src="${i}" data-k="text" rows="3" maxlength="1200" placeholder="Free text: the material, application, industry, quantity or order value" aria-label="Text, entry ${i+1}">${esc(e.text)}</textarea></div>
     <div class="srcb"><button class="btn s ghost" data-act="srcup" data-i="${i}" title="Move up" aria-label="Move entry ${i+1} up"${i?"":" disabled"}>&uarr;</button><button class="btn s ghost" data-act="srcdown" data-i="${i}" title="Move down" aria-label="Move entry ${i+1} down"${i<n-1?"":" disabled"}>&darr;</button><button class="btn s ghost" data-act="srcdel" data-i="${i}" title="Remove" aria-label="Remove entry ${i+1}">${I("x")}</button></div></div>`).join(""):'<div class="liveempty">No entries yet. Add the first one below.</div>'}
   </div>
   <div class="cb row" style="gap:10px;flex-wrap:wrap;border-top:1px solid var(--line2)"><button class="btn" data-act="srcadd">${I("plus")} Add an entry</button><span class="grow"></span>
    ${ui.srcDirty?'<button class="btn" data-act="srcundo">Undo changes</button>':""}<button class="btn pri" data-act="srcsave"${ui.srcDirty&&!ui.srcBusy?"":" disabled"}>${I("ok")} ${ui.srcBusy?"Saving":"Save to website"}</button></div></div>
  </div>`;
};
const match=s=>!ui.q||s.toLowerCase().includes(ui.q.toLowerCase());

/* ============ actions ============ */
function modal(h){$("#mod").innerHTML=`<div class="mod" data-act="bg"><div class="box">${h}</div></div>`}
function closeModal(){$("#mod").innerHTML=""}
function toast(msg,cls){const t=document.createElement("div");t.className="toast "+(cls||"");t.innerHTML=msg;$("#toasts").appendChild(t);setTimeout(()=>{t.style.transition=".3s";t.style.opacity=0;setTimeout(()=>t.remove(),300)},4200)}
function phone(title,msg){const p=document.createElement("div");p.className="phone";p.innerHTML=`<span class="ic">${I("msg")}</span><div class="grow"><div class="row"><b class="grow sm">${esc(title)}</b><span class="xs faint">now</span></div><div class="sm">${esc(msg)}</div></div>`;document.body.appendChild(p);setTimeout(()=>{p.style.transition=".4s";p.style.opacity=0;p.style.transform="translateY(-20px)";setTimeout(()=>p.remove(),400)},5200)}
function notice(text,go){S.notices.unshift({text,at:now(),go,unread:true})}
function convoFor(o){let v=S.convos.find(x=>x.o===o.id);if(!v){v={id:"v"+o.id,c:o.c,o:o.id,ch:"Email",unread:false,msgs:[],ai:""};S.convos.push(v)}return v}

function inGhl(){toast(`Do this in GoHighLevel for now. <a href="${ghl("/dashboard")}" target="_blank" rel="noopener" style="color:#fff;font-weight:700">Open</a>`)}
const ACT={
  menu(){$("#side").classList.toggle("open")},
  bell(){ui.bell=!ui.bell;render()},
  readall(){S.notices.forEach(n=>n.unread=false);ui.bell=false;save();render()},
  refresh(e){if(e)e.preventDefault();load(true)},
  close:closeModal,
  bg(e){if(e.target.classList.contains("mod"))closeModal()},
  quote(e,el){quoteModal(el.dataset.id)},
  call(e,el){window.open(ghl("/contacts/detail/"+el.dataset.id),"_blank")},
  useai(){},send:inGhl,sendq:inGhl,follow:inGhl,win:inGhl,source:inGhl,
  inv(e,el){invModal(el.dataset.id)},
  sendinv:inGhl,remind:inGhl,paid:inGhl,
  srcadd(){ui.src.push({head:"",text:""});ui.srcDirty=true;render();const ins=document.querySelectorAll('[data-k="head"]');if(ins.length){ins[ins.length-1].focus();ins[ins.length-1].scrollIntoView({block:"center"})}},
  srcdel(e,el){const i=+el.dataset.i,x=ui.src[i];if((x.head||x.text)&&!confirm("Remove "+(x.head?'"'+x.head+'"':"this entry")+" from the website?"))return;ui.src.splice(i,1);ui.srcDirty=true;render()},
  srcup(e,el){const i=+el.dataset.i;if(i<1)return;[ui.src[i-1],ui.src[i]]=[ui.src[i],ui.src[i-1]];ui.srcDirty=true;render()},
  srcdown(e,el){const i=+el.dataset.i;if(i>=ui.src.length-1)return;[ui.src[i+1],ui.src[i]]=[ui.src[i],ui.src[i+1]];ui.srcDirty=true;render()},
  srcundo(){ui.src=null;ui.srcDirty=false;render()},
  async srcsave(){
    const blank=ui.src.findIndex(x=>!x.head.trim()&&x.text.trim());
    if(blank>=0){toast("Entry "+(blank+1)+" needs a heading before it can be saved.");return}
    ui.srcBusy=true;render();
    try{const r=await fetch("/api/rm-hq/sourced",{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({examples:ui.src.filter(x=>x.head.trim()||x.text.trim())})});
      if(r.status===401){location.reload();return}
      const d=await r.json();if(!d.ok)throw new Error(d.error||"");
      ui.src=d.examples;ui.srcDirty=false;toast(`${I("ok")} Saved. Your website shows the new list within a minute.`)}
    catch(e){toast("Not saved. "+(e.message||"Could not reach GoHighLevel.")+" Please try again.")}
    ui.srcBusy=false;render();
  },
  csv(){const r=rep12();const q=x=>'"'+String(x).replace(/"/g,'""')+'"';const rows=[["Month","Invoiced (AUD)","Paid (AUD)"],...r.ms.map((m,i)=>[m.l,r.invM[i].toFixed(2),r.paidM[i].toFixed(2)]),[],["Source","Deals","Won","Won value (AUD)"],...r.srcRows.map(([k,x])=>[q(k),x.n,x.w,x.v.toFixed(2)])];
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));a.download="revolution-materials-report.csv";a.click();toast(`${I("dl")} Report downloaded`)}
};
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]"),g=e.target.closest("[data-go]");
  if(a&&!(a.dataset.act==="bg"&&e.target!==a)){
    if(a.dataset.act==="quote"&&e.target.closest("a"))return;
    const f=ACT[a.dataset.act];if(f){f(e,a);return}
  }
  if(g){const to=g.dataset.go;if(!to||to.endsWith("/"))return;closeModal();ui.bell=false;$("#side")&&$("#side").classList.remove("open");if(location.hash==="#/"+to)render();else location.hash="#/"+to}
  else if(ui.bell&&!e.target.closest(".bell")){ui.bell=false;render()}
});
document.addEventListener("change",e=>{if(e.target.id==="pipesel"){PIPE=e.target.value;try{localStorage.setItem("rmhq-pipe",PIPE)}catch(x){}setStages();render()}});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ui.q=e.target.value;ui.focusQ=true;render();return}
  if(e.target.dataset.src!=null){const x=ui.src[+e.target.dataset.src];if(x){x[e.target.dataset.k]=e.target.value;if(!ui.srcDirty){ui.srcDirty=true;const h=document.querySelector(".srcl")&&document.querySelector(".srcl").closest(".card").querySelector(".ch .mut");if(h){h.textContent="Not saved yet";h.style.color="var(--or)";h.style.fontWeight="600"}const b=document.querySelector('[data-act="srcsave"]');if(b)b.disabled=false}}return}
  if(e.target.dataset.line!=null){const box=e.target.closest(".box");const id=box.querySelector("[data-act=sendq]").dataset.id;const o=O(id);const i=+e.target.dataset.line;o.lines[i].p=Math.max(0,parseFloat(e.target.value)||0);
    $("#lt"+i).textContent=money2(o.lines[i].qty*o.lines[i].p);$("#qsub").textContent=money2(val(o));$("#qgst").textContent=money2(val(o)*.1);$("#qtot").textContent=money2(val(o)*1.1);save()}
});
addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
addEventListener("hashchange",render);
addEventListener("beforeunload",e=>{if(ui.srcDirty){e.preventDefault();e.returnValue=""}});
/* drag and drop on the pipeline */
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".op");if(!c)return;dragId=c.dataset.id;c.classList.add("drag");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragId)});
document.addEventListener("dragend",e=>{document.querySelectorAll(".op.drag").forEach(x=>x.classList.remove("drag"));document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over"))});
document.addEventListener("dragover",e=>{const col=e.target.closest&&e.target.closest(".col");if(!col||!dragId)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",e=>{const col=e.target.closest&&e.target.closest(".col");if(!col||!dragId)return;e.preventDefault();const o=O(dragId),to=col.dataset.stage;dragId=null;if(o.stage===to){render();return}
  o.stage=to;let iv=null;if(to==="Won"){o.won=now();iv=makeInvoice(o)}if(to==="Quote sent")o.sent=now();notice(`${C(o.c).co} moved to ${to}`,"pipeline");save();render();
  toast(to==="Won"?`${I("ok")} Won. ${iv?"Draft invoice "+iv.no+" is ready to send.":"Order confirmation sent."}`:to==="Follow up"?`Follow up text scheduled for tomorrow 9am`:to==="Lost"?`Moved to Lost. GoHighLevel will check in again in 90 days.`:`Moved to ${to}. GoHighLevel updated.`)});
/* tooltips */
const tip=$("#tip");
document.addEventListener("mousemove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(!t){tip.style.display="none";return}tip.textContent=t.dataset.tip;tip.style.display="block";const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,e.clientX+12)+"px";tip.style.top=(e.clientY-34)+"px"});

/* ============ load from GoHighLevel ============ */
let loading=false;
const fail=m=>{if(!LIVE.syncedAt)$("#app").innerHTML='<div class="loading">'+m+'</div>'};
async function load(fresh){
  if(loading)return;loading=true;
  try{
    const r=await fetch("/api/rm-hq"+(fresh?"?fresh=1":""),{credentials:"same-origin",cache:"no-store"});
    if(r.status===401){location.reload();return}
    const d=await r.json();
    if(d.configured===false){fail("GoHighLevel is not connected yet. The token still needs adding on the server.");return}
    if(d.failed||!d.contacts){fail("Could not reach GoHighLevel. Trying again in a minute.");return}
    adopt(d);if(!(ui.view==="sourced"&&document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.src!=null))render();
    if(fresh)toast(`${I("ok")} Updated from GoHighLevel`);
  }catch(e){fail("Could not reach GoHighLevel. Trying again in a minute.")}
  finally{loading=false}
}
$("#app").innerHTML='<div class="loading">Loading your GoHighLevel data</div>';
load(false);
setInterval(()=>{if(!document.hidden)load(false)},60000);
})();
</script>
