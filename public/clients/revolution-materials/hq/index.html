<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111316">
<title>Revolution Materials HQ | CEO dashboard demo by BVN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--or:#E86010;--or-d:#C94F08;--or-s:#FDEFE6;--ink:#111316;--ink2:#1B1E23;--bg:#F3F4F6;--card:#fff;--line:#E3E5E9;--line2:#EEF0F3;--text:#16191D;--mut:#6B717A;--faint:#9AA0A8;
--ok:#0E9F6E;--ok-s:#E3F6EE;--warn:#B45309;--warn-s:#FEF3E2;--bad:#C8261B;--bad-s:#FDECEA;--blue:#2563EB;--blue-s:#E8F0FE;--r:14px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--sh2:0 18px 48px rgba(16,24,40,.22)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15}h1{font-size:24px;font-weight:800}h3{font-size:15px;font-weight:700}
.mut{color:var(--mut)}.faint{color:var(--faint)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:600}.r{text-align:right}.nw{white-space:nowrap}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:600;font-size:13px;line-height:1;min-height:36px;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:#F8F9FA;border-color:#CFD3D9}.btn.pri{background:var(--or);border-color:var(--or);color:#fff}.btn.pri:hover{background:var(--or-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:rgba(0,0,0,.05)}
.btn.s{min-height:28px;padding:5px 9px;font-size:12px;border-radius:8px}.btn svg,.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--line2);color:#3d434b;white-space:nowrap}
.tag.or{background:var(--or-s);color:#A8440A}.tag.ok{background:var(--ok-s);color:#08724F}.tag.warn{background:var(--warn-s);color:var(--warn)}.tag.bad{background:var(--bad-s);color:var(--bad)}.tag.blue{background:var(--blue-s);color:#1D4FC4}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}.inp:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(232,96,16,.15)}
/* layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#c9ced6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff}
.brand .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#ff8a3d,var(--or));display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.02em}
.brand b{display:block;font-size:14px;line-height:1.1}.brand small{font-size:11px;color:#8a919c}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b727c;padding:14px 10px 6px;font-weight:700}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#c9ced6;padding:9px 10px;border-radius:9px;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}.nav button.on{background:rgba(232,96,16,.16);color:#fff}.nav button.on svg{color:var(--or)}
.nav .bdg{margin-left:auto;background:var(--or);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.sync{margin-top:auto;font-size:12px;padding:12px 10px;border-top:1px solid rgba(255,255,255,.08)}
.sync div{display:flex;align-items:center;gap:8px;margin:4px 0}.sync i{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.sync a{color:#8a919c;text-decoration:none}.sync a:hover{color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 26px;background:rgba(243,244,246,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top .srch{position:relative;width:min(340px,30vw)}.top .srch svg{position:absolute;left:11px;top:11px;color:var(--faint)}.top .srch input{padding-left:34px}
.demo{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--or);background:var(--or-s);padding:4px 9px;border-radius:999px}
.bell{position:relative}.bell .n{position:absolute;top:2px;right:2px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.npanel{position:absolute;right:0;top:44px;width:340px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);z-index:40;max-height:420px;overflow:auto}
.page{padding:22px 26px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-width:0}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}.ch h3{flex:1}.cb{padding:14px 16px}
.g{display:grid;gap:16px}.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.brief{background:linear-gradient(120deg,#16191d 0%,#22180f 100%);color:#e7e9ee;border:0;padding:20px 22px;position:relative;overflow:hidden}
.brief:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(232,96,16,.35),transparent 70%)}
.brief .tag{background:rgba(232,96,16,.2);color:#ffb27f}.brief h2{font-size:24px;margin:10px 0 6px;color:#fff}.brief p{margin:0;max-width:860px;color:#c3c8d0;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{padding:14px 15px;cursor:pointer;transition:transform .15s,box-shadow .15s}.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,24,40,.1)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:500}.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px}.kpi .d{font-size:12px;color:var(--mut)}.kpi .d.up{color:var(--ok)}.kpi .d.dn{color:var(--bad)}
.kpi.flash{animation:flash 1.6s}@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--or)}100%{box-shadow:var(--sh)}}
/* charts */
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:16px;border-bottom:1px solid var(--line)}
.bars .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;cursor:default}
.bars .c i{display:block;width:70%;max-width:30px;background:#F2B48C;border-radius:4px 4px 0 0;min-height:3px;transition:height .6s}
.bars .c.cur i{background:var(--or)}.bars .c:hover i{filter:brightness(.92)}
.bars .c em{font-style:normal;font-size:11px;color:var(--mut);margin-bottom:4px;font-weight:600}
.blab{display:flex;gap:6px;margin-top:6px}.blab span{flex:1;text-align:center;font-size:10.5px;color:var(--faint)}
.hb{display:grid;grid-template-columns:minmax(110px,150px) 1fr 52px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hb .tr{height:10px;background:var(--line2);border-radius:999px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--or);border-radius:999px}
.hb.ok .tr i{background:var(--ok)}.hb b{text-align:right}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line2);cursor:pointer}.li:first-child{border-top:0}.li:hover{background:#FAFAFB}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.feed .fi{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}.feed .fi:first-child{border-top:0}.feed .t{margin-left:auto;color:var(--faint);font-size:11.5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--or);flex:none;margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFAFB;white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}.tbl tr.ck:hover td{background:#FAFAFB;cursor:pointer}.tbl tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
/* inbox */
.inbox{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 69px)}
.ilist{border-right:1px solid var(--line);background:#fff;overflow:auto}
.ci{padding:13px 16px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;gap:11px}.ci:hover{background:#FAFAFB}.ci.on{background:var(--or-s)}
.ci .p{font-size:12.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ci.unread b{font-weight:800}.ci.unread .p{color:var(--text)}
.thread{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.th{padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.m{max-width:min(560px,80%);padding:10px 13px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:13.5px;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink)}.m small{display:block;font-size:10.5px;opacity:.6;margin-top:5px}
.m.sys{align-self:center;background:transparent;border:1px dashed #cfd3d9;color:var(--mut);font-size:12px;max-width:90%}
.rfqbox{border:1px solid #F2C3A4;background:#FFF8F3;border-radius:12px;padding:10px 12px;margin-top:6px;font-size:12.5px;color:var(--text)}
.ai{margin:0 20px 10px;border:1px solid #F2C3A4;background:#FFF8F3;border-radius:12px;padding:11px 13px;font-size:13px}
.ai .tag{background:var(--or);color:#fff}
.comp{display:flex;gap:8px;padding:12px 20px 18px;background:#fff;border-top:1px solid var(--line)}.comp textarea{resize:none;height:44px}
/* pipeline */
.kan{display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:#E9EBEF;border-radius:14px;padding:10px;min-height:300px;transition:background .15s}.col.over{background:#F8DCC8}
.col h4{margin:2px 4px 10px;font-size:12.5px;display:flex;gap:8px;align-items:center}.col h4 span{color:var(--mut);font-weight:500}
.op{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:grab;box-shadow:var(--sh);transition:transform .12s}.op:hover{transform:translateY(-1px)}
.op.drag{opacity:.4}.op .v{font-weight:800;font-size:15px}
/* modal */
.mod{position:fixed;inset:0;background:rgba(10,12,16,.5);display:grid;place-items:center;z-index:60;padding:16px;animation:fade .15s}
.mod .box{background:#fff;border-radius:18px;width:min(860px,100%);max-height:92vh;overflow:auto;box-shadow:var(--sh2)}
.mh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#fff;z-index:2}.mh h2{font-size:19px;flex:1}
.mb{padding:18px 22px}.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:#fff;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
.qtbl input{width:96px;text-align:right;padding:6px 8px}
.tot{display:flex;justify-content:flex-end;gap:30px;padding:12px 14px;font-size:14px}.tot b{font-size:20px}
/* toasts */
.toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 15px;font-size:13.5px;box-shadow:var(--sh2);max-width:360px;animation:tin .3s;display:flex;gap:10px;align-items:flex-start}
.toast.or{background:linear-gradient(135deg,#ff7a2a,var(--or))}@keyframes tin{from{opacity:0;transform:translateY(12px)}}
.phone{position:fixed;top:16px;right:18px;z-index:85;width:330px;background:rgba(250,250,252,.97);backdrop-filter:blur(14px);border-radius:18px;box-shadow:var(--sh2);padding:12px 14px;display:flex;gap:11px;animation:pin .45s cubic-bezier(.2,.9,.3,1.2)}
.phone .ic{width:38px;height:38px;border-radius:10px;background:#22c55e;display:grid;place-items:center;color:#fff;flex:none}
@keyframes pin{from{opacity:0;transform:translateY(-40px)}}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;z-index:90;white-space:nowrap;display:none}
.empty{padding:30px;text-align:center;color:var(--mut)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;animation:pl 1.4s infinite}@keyframes pl{0%{box-shadow:0 0 0 0 currentColor}100%{box-shadow:0 0 0 8px transparent}}
.new{animation:newrow 2.4s}@keyframes newrow{0%,50%{background:#FFE7D6}}
.seg{display:inline-flex;background:#E9EBEF;border-radius:10px;padding:3px}.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--mut)}.seg button.on{background:#fff;color:var(--text);box-shadow:var(--sh)}
.mbar{display:none}
@media(max-width:1280px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:70;transform:translateX(-100%);transition:transform .25s}.side.open{transform:none;box-shadow:var(--sh2)}
 .mbar{display:inline-flex}.top{padding:12px 14px;gap:8px}.top h1{font-size:19px}.top .srch{display:none}.page{padding:14px 14px 70px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:21px}.li .btn{display:none}.brief h2{font-size:20px}.inbox{grid-template-columns:1fr;height:auto}.inbox.sel .ilist{display:none}.inbox:not(.sel) .thread{display:none}.thread{min-height:calc(100vh - 62px)}
 .phone{left:12px;right:12px;width:auto}.demo{display:none}.top .newbtn span{display:none}
}
</style>
</head>

<div id="mod"></div>

<script>
(function(){

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Math.round(n).toLocaleString("en-AU");

const MIN=60000,HR=60*MIN,DAY=24*HR;
const now=()=>Date.now();
const rel=t=>{const d=now()-t;if(d<MIN)return"just now";if(d<HR)return Math.floor(d/MIN)+" min ago";if(d<DAY)return Math.floor(d/HR)+" hr ago";const n=Math.floor(d/DAY);return n===1?"yesterday":n+" days ago"};

const ICONS={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',inbox:'<path d="M4 4h16v12h-5l-2 3h-2l-2-3H4z"/>',pipe:'<path d="M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v5h-4z"/>',quote:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.6 3.5 5.2"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',plus:'<path d="M12 5v14M5 12h14"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',cube:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',phone:'<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',back:'<path d="M15 18l-6-6 6-6"/>',msg:'<path d="M4 5h16v11H8l-4 4z"/>',ok:'<path d="M5 12l5 5 9-10"/>',ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>',flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};

const BUILDER="/clients/revolution-materials/builder";

/* ============ demo data (shaped like GHL contacts, opportunities and conversations) ============ */

  const contacts=[

    ["c10","Bayside Boat Builders","Chris Papadopoulos","Director","Mordialloc VIC","0415 662 038"],

function stats(){
  const t=now(),o=S.opps;
  const wk=o.filter(x=>t-x.at<7*DAY);
  const open=o.filter(x=>!["Won","Lost"].includes(x.stage));
  const sent=o.filter(x=>["Quote sent","Follow up"].includes(x.stage));
  const won=o.filter(x=>x.stage==="Won"&&t-(x.won||x.at)<30*DAY);
  const closed=o.filter(x=>["Won","Lost"].includes(x.stage));
  const builder=wk.filter(x=>x.src==="3D Part Builder").length;
  const unrep=S.convos.filter(v=>v.unread);
  const stale=o.filter(x=>x.stage==="Follow up"||(x.stage==="Quote sent"&&t-(x.sent||x.at)>4*DAY));
  return {wk,open,sent,won,closed,builder,unrep,stale,openV:open.reduce((a,x)=>a+val(x),0),sentV:sent.reduce((a,x)=>a+val(x),0),wonV:won.reduce((a,x)=>a+val(x),0),rate:closed.length?Math.round(closed.filter(x=>x.stage==="Won").length/closed.length*100):0};
}
function brief(st){
  const h=new Date().getHours();
  const parts=[];
  if(st.unrep.length)parts.push(`${st.unrep.length} new ${st.unrep.length===1?"enquiry is":"enquiries are"} waiting on a reply, the oldest from ${C(st.unrep.slice().sort((x,y)=>last(x).at-last(y).at)[0].c).co}`);
  parts.push(`${kfmt(st.sentV)} in quotes is sitting with customers`);
  if(st.stale.length)parts.push(`${st.stale.length} of those ${st.stale.length===1?"needs":"need"} a follow up today (${st.stale.map(x=>C(x.c).co.split(" ")[0]).slice(0,3).join(", ")})`);
  return {hi:`Good ${h<12?"morning":h<17?"afternoon":"evening"}, Jim`,txt:parts.join(". ")+`. The 3D Part Builder brought in ${st.builder} of this week's ${st.wk.length} enquiries, each with the full spec, weight and cert needs attached.`};
}

function modal(h){$("#mod").innerHTML=`<div class="mod" data-act="bg"><div class="box">${h}</div></div>`}

  menu(){$("#side").classList.toggle("open")},
  bell(){ui.bell=!ui.bell;render()},
  readall(){S.notices.forEach(n=>n.unread=false);ui.bell=false;save();render()},
  reset(e){e.preventDefault();localStorage.removeItem(KEY);S=seed();location.hash="#/overview";render();toast("Demo data reset")},
  close:closeModal,

  sendq(e,el){const o=O(el.dataset.id);o.stage="Quote sent";o.sent=now();o.fresh=false;const n="Q-"+new Date().toISOString().slice(2,7).replace("-","")+"-"+String(10+S.opps.indexOf(o)).padStart(2,"0");
    const v=convoFor(o);v.msgs.push({me:true,text:`Hi ${C(o.c).name.split(" ")[0]}, your quote is attached. ${money(val(o)*1.1)} including GST, stock held for 14 days. Reply here or give me a call with any questions. Jim`,at:now(),doc:n});v.ai="";
    notice(`Quote ${n} sent to ${C(o.c).co}, ${money(val(o))}`,"quotes");save();closeModal();render();toast(`${I("send")} Quote ${n} sent by email and SMS. A follow up text goes out in 3 days if there is no reply.`,"or")},

    notice(`Follow up sent to ${C(o.c).co}`,"inbox/"+v.id);save();closeModal();render();toast(`${I("ok")} Follow up text sent to ${esc(C(o.c).name)}`)},
  win(e,el){const o=O(el.dataset.id);o.stage="Won";o.won=now();notice(`Won: ${C(o.c).co}, ${money(val(o))}`,"pipeline");save();closeModal();render();toast(`${I("ok")} Marked won. GoHighLevel sends the order confirmation and a review request after delivery.`,"or")},

  sim(){simulate()}
};

  notice(`New 3D Part Builder RFQ from ${p.co}, ${money(val(o))}`,"inbox/"+vid);
  save();render();
  phone("GoHighLevel","New RFQ: "+p.co+", "+p.lines[0][2]+" x "+p.lines[0][0]+" ("+GR[p.lines[0][1]]+"). Est. "+money(val(o))+".");
  setTimeout(()=>toast(`${I("cube")} New enquiry from the 3D Part Builder. Contact, deal and conversation created in GoHighLevel. <a href="#/inbox/${vid}" style="color:#fff;font-weight:700">Open</a>`,"or"),700);
  ["k1","k2","k6"].forEach(id=>{const k=document.getElementById(id);if(k){k.classList.remove("flash");void k.offsetWidth;k.classList.add("flash")}});
}

render();
/* first visit: a test enquiry lands a few seconds in, so the demo shows itself */
if(window===top&&!sessionStorage.getItem("rmhq-sim")){sessionStorage.setItem("rmhq-sim","1");setTimeout(()=>{if(ui.view==="overview")simulate()},6000)}
})();
</script>
</body>
