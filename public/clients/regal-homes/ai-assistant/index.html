<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Regal Care Homes — Care Assistant (Sample)</title>
<style>
  :root{
    --navy:#16324f; --navy2:#1e4064; --gold:#c9a24b; --gold-soft:#e7d3a1;
    --bg:#f4f1ea; --card:#ffffff; --ink:#243746; --muted:#6b7c8c;
    --bot:#eef2f6; --user:#16324f; --line:#e4e0d6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#eef1f5,#f4f1ea 60%);
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
  }
  .shell{
    width:min(680px,100%); height:min(760px,94vh);
    background:var(--card); border-radius:20px; overflow:hidden;
    box-shadow:0 24px 70px rgba(20,40,60,.22); display:flex; flex-direction:column;
    border:1px solid var(--line);
  }
  /* Header */
  .head{
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    color:#fff; padding:16px 20px; display:flex; align-items:center; gap:13px;
  }
  .crest{
    width:44px; height:44px; border-radius:12px; background:rgba(255,255,255,.10);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    border:1px solid rgba(255,255,255,.18);
  }
  .crest svg{width:26px; height:26px;}
  .head .who{flex:1; min-width:0;}
  .head .name{font-weight:700; font-size:16px; letter-spacing:.2px;}
  .head .sub{font-size:12.5px; color:#cdd9e4; display:flex; align-items:center; gap:6px; margin-top:2px;}
  .dot{width:8px; height:8px; border-radius:50%; background:#4ade80; box-shadow:0 0 0 3px rgba(74,222,128,.25);}
  .badge{
    font-size:11px; color:var(--navy); background:var(--gold-soft);
    padding:4px 9px; border-radius:999px; font-weight:700; letter-spacing:.3px;
  }
  /* Chat */
  .chat{flex:1; overflow-y:auto; padding:22px 18px; background:var(--bg);}
  .row{display:flex; margin-bottom:14px; gap:9px; align-items:flex-end;}
  .row.user{justify-content:flex-end;}
  .av{
    width:30px; height:30px; border-radius:50%; flex:0 0 auto;
    background:linear-gradient(135deg,var(--gold),#b98f35); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
  }
  .bubble{
    max-width:78%; padding:12px 15px; border-radius:16px; font-size:15px; line-height:1.5;
    box-shadow:0 2px 6px rgba(20,40,60,.06);
  }
  .bot .bubble{background:var(--bot); color:var(--ink); border-bottom-left-radius:5px;}
  .user .bubble{background:var(--user); color:#fff; border-bottom-right-radius:5px;}
  .bubble a{color:inherit; font-weight:700;}
  /* Quick replies */
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 16px 39px;}
  .chip{
    background:#fff; border:1px solid var(--gold); color:var(--navy);
    padding:8px 14px; border-radius:999px; font-size:13.5px; cursor:pointer;
    font-weight:600; transition:.15s;
  }
  .chip:hover{background:var(--navy); color:#fff; border-color:var(--navy);}
  /* Typing */
  .typing{display:flex; gap:4px; padding:14px 15px;}
  .typing span{width:7px; height:7px; border-radius:50%; background:#9fb0bf; animation:b 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes b{0%,60%,100%{opacity:.3; transform:translateY(0);} 30%{opacity:1; transform:translateY(-4px);}}
  /* Composer */
  .composer{padding:12px 14px; border-top:1px solid var(--line); background:#fff; display:flex; gap:10px; align-items:center;}
  .composer input{
    flex:1; border:1px solid var(--line); border-radius:999px; padding:12px 16px;
    font-size:15px; outline:none; background:#f7f6f2;
  }
  .composer input:focus{border-color:var(--gold); background:#fff;}
  .send{
    width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
    background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .send:hover{background:var(--gold); color:var(--navy);}
  .send svg{width:19px; height:19px;}
  .foot{text-align:center; font-size:11px; color:var(--muted); padding:7px; background:#fff;}
  @media (max-width:640px){ body{padding:0;} .shell{height:100vh; border-radius:0;} .bubble{max-width:82%;} }
</style>
</head>
<body>
  <div class="shell">
    <div class="head">
      <div class="crest">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e7d3a1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l3 3 3-5 3 5 3-5 3 5 3-3v8H3z"/><path d="M3 20h18"/>
        </svg>
      </div>
      <div class="who">
        <div class="name">Regal Care Homes</div>
        <div class="sub"><span class="dot"></span> Grace · Care Assistant</div>
      </div>
      <div class="badge">SAMPLE</div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="composer">
      <input id="input" type="text" placeholder="Type your message..." autocomplete="off" />
      <button class="send" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5l19-8.5L3 3.5 3 10l13 2-13 2z"/></svg>
      </button>
    </div>
    <div class="foot">Sample AI assistant built by BVN for Regal Care Homes. Responses are for demonstration.</div>
  </div>

<script>
const PHONE = "(805) 600-2711", EMAIL = "info@regalcare.org";
const chat = document.getElementById("chat");
const input = document.getElementById("input");
let booking = null; // booking state machine

function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function scroll(){ chat.scrollTop = chat.scrollHeight; }

function addUser(text){
  chat.appendChild(el(`<div class="row user"><div class="bubble">${esc(text)}</div><div class="av">You</div></div>`));
  scroll();
}
function addBot(text, chips){
  const row = el(`<div class="row bot"><div class="av">G</div><div class="bubble">${text}</div></div>`);
  chat.appendChild(row);
  if(chips && chips.length){
    const c = el(`<div class="chips"></div>`);
    chips.forEach(t=>{ const b=el(`<button class="chip"></button>`); b.textContent=t; b.onclick=()=>{ addUser(t); respond(t); c.remove(); }; c.appendChild(b); });
    chat.appendChild(c);
  }
  scroll();
}
function typing(cb, delay){
  const t = el(`<div class="row bot"><div class="av">G</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>`);
  chat.appendChild(t); scroll();
  setTimeout(()=>{ t.remove(); cb(); }, delay || 750);
}
function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function botSay(text, chips, delay){ typing(()=>addBot(text, chips), delay); }

// ---- Knowledge base ----
const KB = [
  { k:["hello","hi ","hey","good morning","good afternoon","good evening","start"],
    r:"Hello, and welcome. I am glad you are here. How can I help you and your family today?",
    c:["Tell me about Regal","What care do you provide?","Book a tour","How much does it cost?"] },

  { k:["about","who are you","what is regal","tell me about","learn more"],
    r:"Regal Care Homes provides warm, personalized senior care in comfortable residential homes in the Simi Valley area of California. Instead of a large institution, our residents live in real homes with a small, caring team and a true family feeling. Our belief is simple, that every resident deserves to feel known, safe, and cared for like family. Would you like to hear about the care we provide, or arrange a visit?",
    c:["What care do you provide?","Book a tour","How much does it cost?"] },

  { k:["care","service","provide","offer","assisted","daily living","help with","adl"],
    r:"We provide assisted living care that is tailored to each resident. That includes help with daily activities like bathing, dressing, and mobility, medication management, home cooked meals, housekeeping, and engaging daily activities, with caring staff available around the clock. We also coordinate specialized needs and hospice when the time comes. Every care plan is personal. Would you like to talk with our team about your loved one's specific needs?",
    c:["Book a consultation","Do you offer memory care?","How much does it cost?"] },

  { k:["home","homes","residence","location","where","facility","facilities","located","address"],
    r:"We have three residential care homes in the Simi Valley area, each a real home with a warm, family atmosphere and only a small group of residents, so everyone receives close, personal attention. The best way to get a true feel for them is to visit in person. Would you like me to set up a tour?",
    c:["Book a tour","How much does it cost?","What care do you provide?"] },

  { k:["cost","price","pricing","how much","expensive","afford","rate","fee","monthly"],
    r:"That is a great question. Because every resident's needs are different, the cost depends on the level of care and the room, so we prepare a personalized quote rather than a one size fits all price. The easiest way is a short consultation where we learn about your loved one and give you clear numbers. There is no cost and no obligation. Would you like me to set that up?",
    c:["Book a consultation","What care do you provide?","Do you take insurance?"] },

  { k:["tour","visit","see the","come by","in person","look around"],
    r:"I would love to arrange a visit for you. A tour is the best way to feel the warmth of our homes.",
    c:[], f:()=>startBooking("tour") },

  { k:["consult","consultation","talk to","speak with","meeting","assessment","learn about my"],
    r:"A consultation is a wonderful place to start. We will get to know your loved one and answer all of your questions.",
    c:[], f:()=>startBooking("consultation") },

  { k:["availab","opening","open","room available","space","vacancy","spot"],
    r:"Availability can change from week to week, and we do sometimes have openings across our homes. The best way to check current availability is to speak with our team directly. May I take a few quick details so someone can reach out to you?",
    c:[], f:()=>startBooking("availability") },

  { k:["memory","dementia","alzheimer","cognitive","forget"],
    r:"Many of the families we serve are caring for a loved one with memory loss. Our team can walk you through how we support residents with dementia and memory care during a consultation, and help you understand the right fit. Would you like to set one up?",
    c:["Book a consultation","What care do you provide?"] },

  { k:["medication","medicine","meds","pills","prescription"],
    r:"Yes, medication management is part of the care we provide. Our trained staff safely handle medications as part of each resident's personal care plan.",
    c:["What care do you provide?","Book a consultation"] },

  { k:["meal","food","eat","cook","diet","nutrition","kitchen"],
    r:"Our residents enjoy home cooked meals made fresh each day, with care taken for dietary needs and personal preferences. It is one of the things families tell us they love most about our homes.",
    c:["What care do you provide?","Book a tour"] },

  { k:["insurance","medicaid","medi-cal","medicare","payment","pay","private pay","va ","benefits","financial"],
    r:"Most of our residents are private pay, and our team is happy to walk you through the options and any programs that may help, during a consultation. We want the financial side to feel clear and simple, never stressful. Would you like to talk it through with us?",
    c:["Book a consultation","How much does it cost?"] },

  { k:["hospice","end of life","palliative","comfort care"],
    r:"Yes, we coordinate closely with hospice providers so that residents can remain comfortable and cared for in a familiar home surrounded by people who know them. Our team can explain exactly how that works.",
    c:["Book a consultation","What care do you provide?"] },

  { k:["activit","engage","social","fun","do all day","boredom"],
    r:"Our residents take part in daily activities designed to keep them engaged and connected, from gentle exercise and games to music and time together as a household. A warm, social home is at the heart of what we do.",
    c:["Book a tour","What care do you provide?"] },

  { k:["staff","caregiver","nurse","ratio","who takes care","team"],
    r:"Because our homes are small and residential, our caring team is able to give close, personal attention to every resident, day and night. You are never just a number here. Would you like to meet the team on a visit?",
    c:["Book a tour","Book a consultation"] },

  { k:["contact","phone","call","number","email","reach","talk to someone"],
    r:`You can reach Regal Care Homes anytime at <a href="tel:+18056002711">${PHONE}</a>, or by email at <a href="mailto:${EMAIL}">${EMAIL}</a>. Would you prefer that someone reaches out to you instead? I would be glad to arrange it.`,
    c:["Yes, have someone call me","Book a tour"] },

  { k:["hour","when can","weekend","evening","available time","schedule"],
    r:"We are happy to arrange visits and calls at a time that works for you, including evenings and weekends. Shall I set one up?",
    c:["Book a tour","Book a consultation"] },

  { k:["urgent","emergency","hospital","discharge","right away","asap","soon","immediately","crisis","this week"],
    r:`I understand this may be a stressful and urgent time, and we are here to help quickly. If your loved one is being discharged soon, the fastest step is to speak with our team right away at <a href="tel:+18056002711">${PHONE}</a>. I can also have someone reach out to you immediately. May I take a few quick details?`,
    c:[], f:()=>startBooking("urgent") },

  { k:["thank","thanks","appreciate"],
    r:"You are so very welcome. Caring for a loved one is a big decision, and we are honored to be part of it. Is there anything else I can help you with?",
    c:["Book a tour","Talk to someone","No, that is all"] },

  { k:["no, that is all","that is all","nothing else","no thanks","goodbye","bye"],
    r:`Thank you for spending time with us today. Whenever you are ready, we are here for you at <a href="tel:+18056002711">${PHONE}</a>. Take good care.`,
    c:["Book a tour"] },

  { k:["yes, have someone call me","have someone call","call me","reach out to me"],
    r:"Of course. I would be glad to arrange that for you.",
    c:[], f:()=>startBooking("callback") }
];

// ---- Booking flow ----
function startBooking(kind){
  booking = { kind, step:"name", data:{} };
  const opener = {
    tour:"Let us set up a tour.",
    consultation:"Let us set up your consultation.",
    availability:"Let me get someone to reach out with current availability.",
    urgent:"Let me get someone to reach out to you right away.",
    callback:"Let me arrange your call."
  }[kind] || "Let me help with that.";
  botSay(opener + " First, may I ask your name?");
}
function handleBooking(text){
  const b = booking;
  if(b.step === "name"){
    b.data.name = text.trim(); b.step = "contact";
    botSay(`Thank you, ${esc(firstName(b.data.name))}. What is the best phone number or email to reach you?`);
  } else if(b.step === "contact"){
    b.data.contact = text.trim(); b.step = "situation";
    botSay("And could you tell me a little about who we would be caring for, and roughly when you are hoping to move forward?",
      ["Just exploring","Within a month","As soon as possible"]);
  } else if(b.step === "situation"){
    b.data.situation = text.trim(); b.step = "done";
    const who = b.kind === "tour" ? "Don, our owner, will personally reach out"
      : (b.kind === "consultation" ? "Mel from our care team will reach out"
      : "our care team will reach out");
    booking = null;
    botSay(
      `Wonderful, ${esc(firstName(b.data.name))}. You are all set. ${who} to confirm a time that works for you and to answer every question you have. ` +
      `You can also reach us anytime at <a href="tel:+18056002711">${PHONE}</a>.<br><br>` +
      `<em style="color:#6b7c8c">(This is a sample assistant, so nothing was actually booked. In the live version, this would create your request in the Regal team's system automatically.)</em>`,
      ["Ask another question","No, that is all"], 1000);
  }
}
function firstName(n){ return (n||"").split(" ")[0] || n; }

// ---- Router ----
function respond(text){
  const t = text.toLowerCase();
  if(booking){ typing(()=>handleBooking(text), 650); return; }
  if(/(ask another|another question)/.test(t)){ botSay("Of course. What else would you like to know?", ["What care do you provide?","How much does it cost?","Book a tour"]); return; }
  for(const item of KB){
    if(item.k.some(k => t.includes(k.trim()))){
      if(item.f){ botSay(item.r); setTimeout(item.f, 900); }
      else botSay(item.r, item.c);
      return;
    }
  }
  // fallback
  botSay(`That is a thoughtful question, and I want to be sure you get the right answer. The best step is a quick chat with our team, who can help with anything specific. You can reach us at <a href="tel:+18056002711">${PHONE}</a> or <a href="mailto:${EMAIL}">${EMAIL}</a>, or I can have someone reach out to you. Would you like me to arrange that?`,
    ["Yes, have someone call me","Book a tour","What care do you provide?"]);
}

function submit(){
  const v = input.value.trim(); if(!v) return;
  addUser(v); input.value = ""; respond(v);
}
document.getElementById("send").onclick = submit;
input.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });

// Greeting
setTimeout(()=>{
  addBot("Hello, I am Grace, the Regal Care Homes assistant. I am here to help you find the right care for someone you love. Whether you are just beginning to look or ready to visit, I can answer your questions and set up a consultation or a tour.");
  setTimeout(()=>addBot("What brings you here today?", ["Tell me about Regal","What care do you provide?","Book a tour","How much does it cost?"]), 900);
}, 400);
</script>
</body>
</html>
